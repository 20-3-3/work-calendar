  // ---------- распознавание цифр по эталонам (для двузначных часов) ----------
  let digitTemplates = null;
  function normGlyph(mask, mw, mh){

    const out = new Float32Array(TW*TH);
    const nw = Math.max(1, Math.min(TW, Math.round(w*TH/h))), ox = (TW-nw) >> 1;
    for(let ty=0;ty<TH;ty++) for(let tx=0;tx<nw;tx++){
      // усреднение по соответствующей области исходной маски
      const sx0 = x0 + tx*w/nw, sx1 = x0 + (tx+1)*w/nw, sy0 = y0 + ty*h/TH, sy1 = y0 + (ty+1)*h/TH;
      let s = 0, c = 0;
      for(let y=Math.floor(sy0); y<Math.max(Math.floor(sy0)+1, Math.ceil(sy1)); y++)
        for(let x=Math.floor(sx0); x<Math.max(Math.floor(sx0)+1, Math.ceil(sx1)); x++){ s += mask[y*mw+x] ? 1 : 0; c++; }
      out[ty*TW + ox + tx] = c ? s/c : 0;
    }
    return { v:out, asp:w/h };
  }
  function buildDigitTemplates(){
    const fonts = ['"Times New Roman", Times, serif', 'Georgia, serif', 'Arial, Helvetica, sans-serif', 'Calibri, Carlito, sans-serif'];
    const c = document.createElement('canvas'); c.width = 64; c.height = 64;
    const ctx = c.getContext('2d', { willReadFrequently:true });
    const T = [];
    fonts.forEach(function(f){
      for(let d=0; d<10; d++){
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,64,64);
        ctx.fillStyle = '#fff'; ctx.font = '44px ' + f; ctx.textBaseline = 'middle';
        ctx.fillText(String(d), 14, 32);
        const px = ctx.getImageData(0,0,64,64).data, m = new Uint8Array(64*64);
        for(let i=0;i<m.length;i++) m[i] = px[i*4] > 128 ? 1 : 0;
        const g = normGlyph(m, 64, 64);
        if(g) T.push({ d:d, v:g.v, asp:g.asp });
      }
    });
    return T;
  }
  function classifyGlyph(mask, mw, mh, allowNarrowOne){
    if(!digitTemplates) digitTemplates = buildDigitTemplates();
    const g = normGlyph(mask, mw, mh);
    if(!g) return null;
    if(allowNarrowOne !== false && g.asp < 0.33) return { d:1, score:1 };
    let best = null;
    const mean = function(v){ let s=0; for(let i=0;i<v.length;i++) s+=v[i]; return s/v.length; };
    const ga = mean(g.v);
    digitTemplates.forEach(function(t){
      const ta = mean(t.v); let num = 0, da = 0, db = 0;
      for(let i=0;i<g.v.length;i++){ const a = g.v[i]-ga, b = t.v[i]-ta; num += a*b; da += a*a; db += b*b; }
      let c = num / Math.sqrt(da*db + 1e-6);
      c -= 0.6*Math.abs(Math.log((g.asp+0.05)/(t.asp+0.05)));
      if(!best || c > best.score) best = { d:t.d, score:c };
    });
    return best;
  }

  // ---------- чтение строки сотрудника ----------
  function readRow(P, H, nd, anchor, pitch, lines, words){
    const b = colPitch(H, nd);
    const xs0 = Math.max(0, Math.floor(xOfDay(H, 0.5) - 2)), xs1 = Math.min(P.W-1, Math.ceil(xOfDay(H, nd+0.5) + 2));
    const band = rowBand(lines, anchor.x, anchor.y, pitch, H.py[1] || 0);
    const inner = sampleBand(P, band, xs0, xs1, 0.12, 0.9, 20);
    const zoneDefs = [[-0.18,-0.06],[0.05,0.13],[0.9,0.96],[1.06,1.18]];
    const zones = zoneDefs.map(function(z){ return sampleBand(P, band, xs0, xs1, z[0], z[1], 4); });
    const w = inner.w, n = inner.n, S = inner.S, tl = P.textLevel;
    const bg = new Float32Array(w), col = new Float32Array(n);
    for(let i=0;i<w;i++){ for(let r=0;r<n;r++) col[r] = S[r*w+i]; bg[i] = percentile(col, 75); }
    const strict0 = new Uint8Array(n*w);
    for(let i=0;i<w;i++){ const thr = Math.max(30, 0.35*Math.max(1, bg[i]-tl)); for(let r=0;r<n;r++) if(bg[i]-S[r*w+i] > thr) strict0[r*w+i] = 1; }
    // тонкий штрих может быть размазан на два столбца — объединяем соседние
    const strict = new Uint8Array(n*w);
    for(let r=0;r<n;r++) for(let i=0;i<w;i++){ const k = r*w+i; strict[k] = strict0[k] | (i>0 ? strict0[k-1] : 0) | (i<w-1 ? strict0[k+1] : 0); }
    // линия сетки: тёмная у верхней границы строки (снаружи и внутри) и у нижней
    const zfrac = zones.map(function(Z){
      const f = new Float32Array(w);
      for(let i=0;i<w;i++){ const thr = Math.max(18, 0.18*Math.max(1, bg[i]-tl)); let c = 0; for(let r=0;r<Z.n;r++) if(bg[i]-Z.S[r*w+i] > thr) c++; f[i] = c/Z.n; }
      return f;
    });
    const line = new Uint8Array(w);
    for(let i=0;i<w;i++) line[i] = (zfrac[0][i] >= 0.5 && zfrac[1][i] >= 0.5 && (zfrac[2][i] >= 0.5 || zfrac[3][i] >= 0.5)) ? 1 : 0;
    const lx = new Uint8Array(w);
    for(let i=0;i<w;i++) lx[i] = line[i] | (i>0 ? line[i-1] : 0) | (i<w-1 ? line[i+1] : 0);
    const glyph = new Uint8Array(w);
    for(let i=0;i<w;i++){ let c = 0; for(let r=0;r<n;r++) c += strict[r*w+i]; glyph[i] = (c/n >= 0.2 && !lx[i]) ? 1 : 0; }
    const extOf = function(i0, i1){ let e = 0; for(let r=0;r<n;r++){ for(let i=i0;i<=i1;i++){ if(strict[r*w+i]){ e++; break; } } } return e/n; };
    const blobs = [];
    for(let i=0;i<w;){
      if(glyph[i]){ let j = i; while(j+1 < w && glyph[j+1]) j++; if(extOf(i, j) >= 0.15) blobs.push([i, j]); i = j+1; }
      else i++;
    }
    const cells = {};
    blobs.forEach(function(bl){
      const d = Math.round(dayOfX(H, xs0 + (bl[0]+bl[1])/2, nd));
      if(d >= 1 && d <= nd) (cells[d] = cells[d] || []).push(bl);
    });
    const res = {}, spans = {};
    Object.keys(cells).forEach(function(k){
      const d = +k, bl = cells[d];
      const i0 = Math.min.apply(null, bl.map(function(x){ return x[0]; })), i1 = Math.max.apply(null, bl.map(function(x){ return x[1]; }));
      const X0 = xs0 + i0, h = band.bot(X0) - band.top(X0);
      if(extOf(i0, i1) < 0.35) return;               // слишком низкий знак — не цифра
      const span = Math.max(1, (i1 - i0 + 1) - 2);   // минус расширение на 1 px с каждой стороны
      if(span > 1.1*b){ res[d] = 'text'; return; }   // надпись через несколько клеток («предварительно»)
      if(span >= 0.3*h){ res[d] = '?'; spans[d] = [i0, i1]; }
      else res[d] = 1;
    });
    // двузначные значения: сначала — числа, которые прочитал движок распознавания текста;
    // если он клетку пропустил — сравниваем цифры с эталонами в полном разрешении фото
    Object.keys(spans).forEach(function(k){
      const d = +k, i0 = spans[d][0], i1 = spans[d][1];
      const X0 = xs0 + i0, X1 = xs0 + i1, h = band.bot(X0) - band.top(X0);
      const ymid = (band.top((X0+X1)/2) + band.bot((X0+X1)/2)) / 2;
      const hit = (words||[]).filter(function(t){
        return /^\d{1,2}$/.test(t.text) && t.x0 < X1 + 2 && t.x1 > X0 - 2 && Math.abs(t.yc - ymid) < 0.5*h && +t.text >= 2 && +t.text <= 24;
      });
      const two = hit.filter(function(t){ return t.text.length === 2; });
      if(two.length){ res[d] = +two[0].text; return; }
      const hn = Math.max(24, Math.round(0.78*h));
      const Z = sampleBand(P, band, X0, X1 + 1, 0.12, 0.9, hn), zw = Z.w;
      const zb = new Float32Array(zw), zc = new Float32Array(hn);
      for(let i=0;i<zw;i++){ for(let r=0;r<hn;r++) zc[r] = Z.S[r*zw+i]; zb[i] = Math.max(bg[i0+i] || 0, percentile(zc, 75)); }
      const m0 = new Uint8Array(hn*zw), cols = new Uint8Array(zw);
      for(let i=0;i<zw;i++){
        if(lx[i0+i]) continue; // линии сетки не трогаем
        const thr = Math.max(30, 0.35*Math.max(1, zb[i]-tl));
        for(let r=0;r<hn;r++) if(zb[i]-Z.S[r*zw+i] > thr){ m0[r*zw+i] = 1; cols[i] = 1; }
      }
      let groups = [];
      for(let i=0;i<zw;){ if(cols[i]){ let j = i; while(j+1 < zw && cols[j+1]) j++; groups.push([i, j]); i = j+1; } else i++; }
      const rowsOf = function(g){ let e = 0; for(let r=0;r<hn;r++){ for(let i=g[0];i<=g[1];i++){ if(m0[r*zw+i]){ e++; break; } } } return e/hn; };
      groups = groups.filter(function(g){ return rowsOf(g) >= 0.3; });
      while(groups.length > 2){ // склеиваем по наименьшему промежутку
        let bi = 0, bgap = 1e9;
        for(let q=0;q<groups.length-1;q++){ const gap = groups[q+1][0]-groups[q][1]; if(gap < bgap){ bgap = gap; bi = q; } }
        groups.splice(bi, 2, [groups[bi][0], groups[bi+1][1]]);
      }
      let str = '';
      groups.forEach(function(g, gi){
        const gw = g[1]-g[0]+1, m = new Uint8Array(gw*hn);
        for(let r=0;r<hn;r++) for(let i=0;i<gw;i++) m[r*gw+i] = m0[r*zw + g[0] + i];
        const cl = classifyGlyph(m, gw, hn, gi === 0);
        if(cl) str += cl.d;
      });
      const v = parseInt(str, 10);
      res[d] = (v >= 2 && v <= 24) ? v : '?';
    });
    return { days:res, band:band, xs0:xs0, xs1:xs1 };
  }

  // ---------- поиск сотрудника по ФИО ----------
  function normRu(s){ return String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[^а-яa-z]/g,''); }
  function lev(a, b){
    const m = a.length, n = b.length; if(!m) return n; if(!n) return m;
    let prev = new Array(n+1), cur = new Array(n+1);
    for(let j=0;j<=n;j++) prev[j] = j;
    for(let i=1;i<=m;i++){
      cur[0] = i;
      for(let j=1;j<=n;j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1] ? 0 : 1));
      const t = prev; prev = cur; cur = t;
    }
    return prev[n];
  }
  function sim(a, b){ if(!a || !b) return 0; return 1 - lev(a, b)/Math.max(a.length, b.length); }
  function findPerson(words, fio){
    const parts = String(fio||'').trim().split(/\s+/).map(normRu).filter(Boolean);
    if(!parts.length) return null;
    const sur = parts[0], first = parts[1] || '';
    const ws = words.map(function(w){ return Object.assign({ n:normRu(w.text) }, w); }).filter(function(w){ return w.n.length >= 2 && /[а-я]/.test(w.n); });
    let best = null;
    ws.forEach(function(w){
      let s1 = sim(w.n, sur);
      if(sur.length >= 5 && w.n.length >= 5 && w.n.slice(0,5) === sur.slice(0,5)) s1 = Math.max(s1, 0.8);
      if(s1 < 0.6) return;
      let s2 = first ? 0 : 0.6, firstWord = '';
      ws.forEach(function(o){
        if(o === w || Math.abs(o.yc - w.yc) > 0.6*Math.max(w.h, o.h) || o.x0 <= w.x0 || o.x0 - w.x1 > 12*w.h) return;
        let s = sim(o.n, first);
        if(first && o.n.length <= 2 && o.n[0] === first[0]) s = Math.max(s, 0.7); // инициал «В.»
        if(s > s2){ s2 = s; firstWord = o.text; }
      });
      const score = s1 + s2;
      if(!best || score > best.score) best = { score:score, s1:s1, s2:s2, x:w.xc, y:w.yc, label:(w.text + (firstWord ? ' ' + firstWord : '')) };
    });
    if(!best || best.s1 < 0.6 || (first && best.s2 < 0.55)) return null;
    return best;
  }

  // ---------- месяц и год ----------
  function detectMonth(words, H, maxDay){
    const now = new Date();
    const names = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
    let nameM = -1, nameScore = 0, year = null;
    words.forEach(function(w){
      const t = normRu(w.text);
      names.forEach(function(nm, i){
        const s = t.length >= 3 ? sim(t, nm) : 0;
        if(s > nameScore && s >= (nm.length <= 4 ? 0.99 : 0.72)){ nameScore = s; nameM = i; }
      });
      const y = String(w.text).match(/\b(20\d\d)\b/);
      if(y) year = +y[1];
    });
    // день недели 1-го числа по подписям «пн вт ср…» под номерами дней
    const wdNames = ['пн','вт','ср','чт','пт','сб','вс'];
    const votes = [0,0,0,0,0,0,0];
    words.forEach(function(w){
      const idx = wdNames.indexOf(normRu(w.text));
      if(idx < 0 || !H) return;
      const d = Math.round(dayOfX(H, w.xc, 31));
      if(d >= 1 && d <= 31) votes[((idx - (d-1)) % 7 + 7) % 7]++;
    });
    const vmax = Math.max.apply(null, votes), wd1 = vmax >= 2 ? votes.indexOf(vmax) : -1;
    let best = null;
    for(let k=-12;k<=12;k++){
      const dt = new Date(now.getFullYear(), now.getMonth()+k, 1), m = dt.getMonth(), y = dt.getFullYear();
      let s = 0;
      if(m === nameM) s += 3;
      if(year && y === year) s += 1.5;
      if(wd1 >= 0 && ((dt.getDay()+6) % 7) === wd1) s += 2;
      if(maxDay >= 28 && daysInMonth(y, m) === maxDay) s += 1;
      s -= Math.abs(k)*0.01 + (k < 0 ? 0.005 : 0); // при равенстве — ближайший, лучше будущий
      if(!best || s > best.s) best = { s:s, m:m, y:y };
    }
    const dtB = new Date(best.y, best.m, 1);
    const sure = best.m === nameM || (wd1 >= 0 && ((dtB.getDay()+6) % 7) === wd1 && maxDay >= 28 && daysInMonth(best.y, best.m) === maxDay);
    return { month:best.m, year:best.y, sure:sure };
  }

  // ---------- превью строки для проверки ----------
  function rowPreview(P, H, nd, row, days){
    const hb = H.h, xs0 = row.xs0, xs1 = row.xs1;
    const header = { top:function(x){ return polyval(H.py, x) - 0.9*hb; }, bot:function(x){ return polyval(H.py, x) + 0.9*hb; } };
    const rh = Math.round(Math.max(16, row.band.bot(xs0) - row.band.top(xs0)) * 1.2);
    const hh = Math.round(1.8*hb);
    const A = sampleBand(P, header, xs0, xs1, 0, 1, hh), B = sampleBand(P, row.band, xs0, xs1, -0.1, 1.1, rh);
    const w = xs1 - xs0, target = 44, sc = target / Math.max(hh, rh);
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w*sc)); c.height = Math.round((hh + rh)*sc) + 4;
    const tmp = document.createElement('canvas'); tmp.width = w; tmp.height = hh + rh + 4;
    const tctx = tmp.getContext('2d'); const id = tctx.createImageData(w, hh + rh + 4);
    const put = function(Z, off){ for(let r=0;r<Z.n;r++) for(let i=0;i<w;i++){ const v = Z.S[r*w+i]; const k = ((r+off)*w + i)*4; id.data[k] = id.data[k+1] = id.data[k+2] = v; id.data[k+3] = 255; } };
    put(A, 0); put(B, hh + 4);
    for(let i=0;i<w;i++) for(let r=hh;r<hh+4;r++){ const k = (r*w+i)*4; id.data[k] = 255; id.data[k+1] = 149; id.data[k+2] = 0; id.data[k+3] = 255; }
    tctx.putImageData(id, 0, 0);
    const ctx = c.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(tmp, 0, 0, c.width, c.height);
    // отметки найденных смен под строкой
    Object.keys(days).forEach(function(k){
      const d = +k, x = (xOfDay(H, d) - xs0) * sc;
      ctx.fillStyle = days[d] === '?' ? '#FF9500' : '#39FF14';
      ctx.fillRect(x - 6, c.height - 3, 12, 3);
    });
    return c.toDataURL('image/jpeg', 0.85);
  }

  // ---------- весь процесс ----------
  async function processImport(file){
    const run = ++impRun;
    const p = impProfile();
    imp = { stage:'loading', msg:'Открываю фото…', pct:0, result:null, pickUrl:null, error:null };
    render();
    try{
      const img = await loadImageFromFile(file);
      if(run !== impRun) return;
      const P = prepImage(img);
      imp.msg = 'Загружаю модуль распознавания…'; render();
      await ensureTesseract();
      if(run !== impRun) return;
      const words = await runOCR(P.canvas, run);
      if(run !== impRun) return;
      imp.msg = 'Ищу твою строку в таблице…'; imp.pct = 100; render();
      await new Promise(function(r){ setTimeout(r, 30); });
      const H = fitHeader(words, P.W);
      if(!H) throw new Error('Не нашёл на фото шапку с номерами дней. Сфотографируй таблицу ровнее и так, чтобы строка с числами месяца попала в кадр.');
      const mon = detectMonth(words, H, H.maxDay);
      const nd = daysInMonth(mon.year, mon.month);
      const b = colPitch(H, nd);
      const xStart = Math.max(0, xOfDay(H, 0.5) - 12*b);
      const lines = trackLines(P, xStart, Math.min(P.W, xOfDay(H, nd+0.5) + 2), H.py[1] || 0, Math.max(10, Math.round(2*b)));
      const pitch = estimatePitch(lines, xOfDay(H, 1), b) || 1.8*H.h;
      impData = { P:P, words:words, H:H, nd:nd, lines:lines, pitch:pitch, month:mon };
      const who = findPerson(words, p.fio);
      if(!who){
        // не нашли — просим показать строку на фото
        imp.stage = 'pick';
        imp.pickUrl = P.canvas.toDataURL('image/jpeg', 0.8);
        imp.pickRatio = P.W / P.H;
        render();
        return;
      }
      finishImport({ x:who.x, y:who.y }, who.label, false);
    }catch(e){
      if(run !== impRun) return;
      let msg = (e && e.message) || '';
      if(msg === 'image') msg = 'Не удалось открыть фото. Попробуй другое.';
      else if(msg === 'no Tesseract' || msg.indexOf('xlsx') === 0 || msg === 'start' || /load|fetch|network|Failed/i.test(msg)) msg = 'Не удалось загрузить модуль распознавания. Проверь интернет и попробуй ещё раз (нужен только при первом использовании).';
      else if(!/[а-я]/i.test(msg)) msg = 'Не получилось разобрать фото. Попробуй снять таблицу ровнее и крупнее.';
      imp = { stage:'idle', msg:'', pct:0, result:null, pickUrl:null, error:null };
      impData = null;
      showAlert(msg);
    }
  }
  function finishImport(anchor, label, manual){
    const D = impData; if(!D) return;
    const row = readRow(D.P, D.H, D.nd, anchor, D.pitch, D.lines, D.words);
    const days = {};
    Object.keys(row.days).forEach(function(k){ if(row.days[k] !== 'text') days[+k] = row.days[k]; });
    const orig = Object.assign({}, days);
    let preview = null;
    try{ preview = rowPreview(D.P, D.H, D.nd, row, days); }catch(e){}
    imp = { stage:'review', msg:'', pct:0, pickUrl:null, error:null, result:{
      month:D.month.month, year:D.month.year, monthSure:D.month.sure, days:days, orig:orig, label:label, manual:manual, preview:preview
    } };
    // картинка больше не нужна — освобождаем память
    impData = null;
    render();
  }

  // ---------- интерфейс ----------
  function renderImportCard(){
    const p = impProfile();
    const pc = (getWorkplace(p.importWp)||{}).color || '#39FF14';
    let html = '<div class="settings open imp-card" style="--focus:'+pc+';border-color:'+hexA(pc,0.35)+';">';
    html += '  <div class="section-title">Импорт графика с фото</div>';
    if(imp.stage === 'loading'){
      html += '  <div class="imp-status">'+esc(imp.msg||'Работаю…')+'</div>';
      html += '  <div class="imp-bar"><div style="width:'+Math.max(4, Math.min(100, imp.pct||0))+'%;background:'+pc+';box-shadow:0 0 10px '+pc+';"></div></div>';
      html += '  <div class="imp-hint">Фото обрабатывается прямо на телефоне и никуда не отправляется.</div>';
      html += '  <div class="choice" style="margin-top:12px;color:var(--muted);text-align:center;" onclick="WC.importCancel()">Отмена</div>';
    } else if(imp.stage === 'pick'){
      html += '  <div class="imp-status">Не нашёл «'+esc(p.fio)+'» на фото. Нажми на свою фамилию на снимке.</div>';
      html += '  <div class="imp-pick"><img src="'+imp.pickUrl+'" alt="Фото графика" onclick="WC.importPick(event)"></div>';
      html += '  <div class="choice" style="margin-top:12px;color:var(--muted);text-align:center;" onclick="WC.importCancel()">Отмена</div>';
    } else if(imp.stage === 'review' && imp.result){
      html += renderImportReview(p, pc);
    } else {

  }
  function impDayLabel(v){ return v===undefined ? 'нет смены' : (v===1 ? 'смена' : (v==='?' ? 'смена, часы не распознаны' : numText(v)+' ч')); }
  function impGridHtml(R, pc){
    const nd = daysInMonth(R.year, R.month);
    let html = '<div class="weekdays">'+WEEKDAYS.map(function(w){ return '<div>'+w+'</div>'; }).join('')+'</div>';
    html += '<div class="grid imp-grid">';
    const lead = leadingBlanks(R.year, R.month);
    for(let i=0;i<lead;i++) html += '<div class="day blank"></div>';
    for(let d=1; d<=nd; d++){
      const v = R.days[d];
      let label = '', style = '';
      if(v === 1){ label = 'смена'; style = 'color:'+pc+';box-shadow:0 0 0 1.5px '+pc+' inset;background:'+pc+'1f;'; }
      else if(v === '?'){ label = '?'; style = 'color:#FF9500;box-shadow:0 0 0 1.5px #FF9500 inset;background:#FF95001f;'; }
      else if(typeof v === 'number'){ label = numText(v)+' ч'; style = 'color:'+pc+';box-shadow:0 0 0 1.5px '+pc+' inset;background:'+pc+'1f;'; }
      const sel = R.sel === d ? 'outline:2px solid var(--text);outline-offset:-2px;' : '';
      html += '<div class="day" style="min-height:40px;'+style+sel+'" onclick="WC.importToggle('+d+')"><div class="num">'+d+'</div><div class="amt" style="color:inherit;">'+label+'</div></div>';
    }
    return html + '</div>';
  }
  function impCountHtml(R){
    let cntShift = 0, cntHours = 0, cntQ = 0;
    Object.keys(R.days).forEach(function(k){ const v = R.days[k]; if(v === 1) cntShift++; else if(v === '?') cntQ++; else if(typeof v === 'number') cntHours++; });
    const total = cntShift + cntHours + cntQ;
    return 'Смен: '+total+(cntHours?' · с часами: '+cntHours:'')+(cntQ?' · <span style="color:#FF9500;">часы не распознаны: '+cntQ+' — проверь их или будут записаны как обычные смены</span>':'')+'. Нажми на день, чтобы поправить.';
  }

  const importActions = {
    importChoose(){
      const p = impProfile();
      if(!normRu(p.fio)){ showAlert('Сначала впиши фамилию и имя — так, как они написаны в графике.'); return; }

      const p = impProfile();

      else p[key] = value;
      scheduleSave();
    },
    importSet(key, value){
      const p = impProfile();
      if(key === 'importHours'){ const v = parseFloat(value); p.importHours = v > 0 ? v : p.importHours; }
      else p[key] = value;
      saveState(); render();
    },
    importCancel(){
      impRun++;
      if(impWorker){ try{ impWorker.terminate(); }catch(e){} impWorker = null; }
      imp = { stage:'idle', msg:'', pct:0, result:null, pickUrl:null, error:null };
      impData = null;
      render();
    },
    importPick(ev){
      if(!impData) return;
      const r = ev.target.getBoundingClientRect();
      const x = (ev.clientX - r.left) / r.width * impData.P.W, y = (ev.clientY - r.top) / r.height * impData.P.H;
      finishImport({ x:x, y:y }, 'строка по твоему нажатию', true);
    },
    importMonth(dir){
      const R = imp.result; if(!R) return;
      R.month += dir; if(R.month < 0){ R.month = 11; R.year--; } if(R.month > 11){ R.month = 0; R.year++; }
      R.monthSure = true;
      const nd = daysInMonth(R.year, R.month);
      Object.keys(R.days).forEach(function(k){ if(+k > nd) delete R.days[k]; });
      render();
    },
    importToggle(d){
      const R = imp.result; if(!R) return;
      if(R.sel === d){ R.sel = null; render(); return; }
      R.sel = d;
      if(R.days[d] === undefined) R.days[d] = 1;   // нажатие на пустой день — сразу ставим смену
      render();
    },
    importDaySet(d, v){
      const R = imp.result; if(!R) return;
      if(v === null) delete R.days[d]; else R.days[d] = v;
      render();
    },
    importDayHours(val){
      const R = imp.result; if(!R || !R.sel) return;
      const v = parseNum(val);
      if(v > 1 && v <= 24) R.days[R.sel] = v;
      else if(String(val).trim() === '') R.days[R.sel] = 1;
      else return;
      const p = impProfile(), pc = (getWorkplace(p.importWp)||{}).color || '#39FF14';
      const g = document.getElementById('impGridWrap'); if(g) g.innerHTML = impGridHtml(R, pc);
      const l = document.getElementById('impDayLabel'); if(l) l.textContent = impDayLabel(R.days[R.sel]);
      const n = document.getElementById('impCount'); if(n) n.innerHTML = impCountHtml(R);
    },
    importApply(){
      const R = imp.result, p = impProfile(); if(!R) return;
      const nd = daysInMonth(R.year, R.month);
      let added = 0, skipped = 0;
      for(let d=1; d<=nd; d++){
        const k = dateKey(R.year, R.month, d), cur = state.shifts[k], v = R.days[d];
        if(v !== undefined){
          if(cur && cur.workplaceId && cur.workplaceId !== p.importWp){ skipped++; continue; } // день уже занят другой работой
          state.shifts[k] = { workplaceId:p.importWp, hours:(typeof v === 'number' && v > 1) ? v : p.importHours, dayOff:false };
          added++;
        } else if(p.importOff === 'off' && !cur){
          state.shifts[k] = { dayOff:true };
        }
      }
      saveState();
      imp = { stage:'idle', msg:'', pct:0, result:null, pickUrl:null, error:null };
      view.year = R.year; view.month = R.month; selectedDate = null;
      showFlash('✓ Добавлено смен: '+added + (skipped ? ' · пропущено '+skipped+' (там уже другая работа)' : ''));
      WC.switchTab('calendar');
    },
    _importDebug(){ return imp; }
  };

  window.WC = {

    openPaymentForm(from, to){

    },
    cancelPaymentForm(){ paymentFormState = null; render(); },
    setPaymentField(key, value){ if(!paymentFormState) return; paymentFormState[key] = value; render(); },
    editPayment(key, value){ if(paymentFormState) paymentFormState[key] = value; },
    savePayment(){
      if(!paymentFormState) return;
      const amt = parseNum(paymentFormState.amount);
      if(!amt || amt<=0){ showAlert('Укажи сумму больше нуля.'); return; }
      if(!Array.isArray(state.payments)) state.payments = [];
      state.payments.push({
        id: 'p'+Date.now(),
        periodFrom: paymentFormState.periodFrom,
        periodTo: paymentFormState.periodTo,

      });

    deletePayment(id){

      });
    },
    exportWorkplace(wpId){
      const wp = getWorkplace(wpId);
      const rows = buildWorkplaceRows(wpId, exportForm.from, exportForm.to);
      const name = wp ? wp.name : 'Работа';
      exportWorkbook([{ name, rows }], name.replace(/[\\\/:\*\?"<>\|]/g,'') + '_' + exportForm.from + '_' + exportForm.to + '.xlsx');
    },
    exportAll(){
      const allKeys = Object.keys(state.shifts).filter(k=> (!exportForm.from || k>=exportForm.from) && (!exportForm.to || k<=exportForm.to)).sort();
      const combinedRows = allKeys.map(k=>{
        const s = state.shifts[k];
        if(s.dayOff) return { 'Дата':k, 'Место':'Выходной', 'Часов':'', 'Оплата':0 };
        const wp = getWorkplace(s.workplaceId);
        const pay = calcPay(s);
        return {
          'Дата': k,
          'Место': wp ? wp.name : '—',
          'Часов': (s.hours!=null ? s.hours : ''),
          'Оплата': Math.round(pay*100)/100
        };
      });
      const sheets = [{ name:'Все', rows: combinedRows }];
      state.workplaces.forEach(w=> sheets.push({ name: w.name, rows: buildWorkplaceRows(w.id, exportForm.from, exportForm.to) }));
      exportWorkbook(sheets, 'Табель-полный_'+exportForm.from+'_'+exportForm.to+'.xlsx');
    },
    setPatternField(key, value){
      if(key==='workDays' || key==='offDays' || key==='hours'){
        const n = parseNum(value);
        if(String(value).trim() === '') patternForm[key] = '';
        else if(isFinite(n)) patternForm[key] = n;
        else return;
        if(key !== 'hours'){
          const box = document.getElementById('patternPresets');
          const pc = (getWorkplace(patternForm.workplaceId)||{}).color || '#FF9500';
          if(box) box.innerHTML = patternPresetsHtml(pc);
        }
      } else {
        patternForm[key] = value;
        render();
      }
    },
    setPatternPreset(w, o){ patternForm.workDays = w; patternForm.offDays = o; render(); },
    setPatternFillMode(mode){ patternForm.fillMode = mode; render(); },
    applyPattern(){
      const wd = Math.max(1, Math.round(patternForm.workDays || 0));
      const od = Math.max(0, Math.round(patternForm.offDays || 0));
      const cycle = wd + od;
      const parts = String(patternForm.startDate||'').split('-').map(Number);
      if(parts.length !== 3 || parts.some(isNaN)) return;
      const [sy, sm, sd] = parts;
      const startD = new Date(sy, sm-1, sd);
      let endD;
      if(patternForm.fillMode === 'week'){
        const dow = (startD.getDay()+6)%7; // 0=понедельник ... 6=воскресенье
        const daysUntilSunday = 6 - dow;
        endD = new Date(sy, sm-1, sd + daysUntilSunday);
      } else {
        endD = new Date(sy, sm-1, daysInMonth(sy, sm-1));
      }
      const hoursVal = patternForm.hours || 0;
      let i = 0;
      let cur = new Date(startD);
      while(cur <= endD){
        const k = dateKey(cur.getFullYear(), cur.getMonth(), cur.getDate());
        if(i % cycle < wd){
          state.shifts[k] = { workplaceId: patternForm.workplaceId, hours: hoursVal, dayOff:false };
        } else {
          state.shifts[k] = { dayOff:true };
        }
        i++;
        cur.setDate(cur.getDate()+1);
      }
      view.year = sy; view.month = sm-1;
      selectedDate = null;
      saveState();
      showFlash('✓ Шаблон применён');
      WC.switchTab('calendar');
    },

    setHours(v){

      if(el) el.click();
    },
    handleBackupFile(file){
      if(!file) return;
      const reader = new FileReader();
      reader.onload = function(e){
        let parsed;
        try{ parsed = JSON.parse(e.target.result); }
        catch(err){ showAlert('Не удалось прочитать файл — это не похоже на резервную копию из этого приложения.'); return; }
        if(!parsed || (!parsed.workplaces && !parsed.shifts)){
          showAlert('Файл не похож на резервную копию этого приложения.');
          return;
        }
        askConfirm('Восстановить данные из файла? Текущие смены, места работы и выплаты будут заменены.', function(){
          const migrated = migrateState(parsed);
          if(migrated.workplaces) state.workplaces = migrated.workplaces;
          if(migrated.shifts) state.shifts = migrated.shifts;
          state.payments = Array.isArray(migrated.payments) ? migrated.payments : [];
          if(migrated.profile && typeof migrated.profile === 'object') state.profile = migrated.profile;
          state.version = migrated.version;
          normalizeState();
          saveState(); render();
        });
      };
      reader.readAsText(file);
    },
    addWorkplace(){
      if(activeWorkplaces().length >= 10){ showAlert('Максимум 10 текущих мест работы.'); return; }
      const idx = state.workplaces.length;
      state.workplaces.push({
        id: 'w'+Date.now(),
        name: 'Работа '+(idx+1),
        color: SWATCH_COLORS[idx % SWATCH_COLORS.length],
        payType: 'hourly',
        rate: 0,
        currency: '₽'
      });
      saveState(); render();
    },
    removeWorkplace(idx){
      if(activeWorkplaces().length <= 1){ showAlert('Должно остаться хотя бы одно текущее место работы.'); return; }
      const w = state.workplaces[idx];
      if(!w) return;
      askConfirm('Убрать «'+w.name+'» из текущих мест работы? Все отработанные смены и заработок останутся в календаре и отчётах — работа переедет в «Бывшие места работы», откуда её можно вернуть.', function(){
        w.archived = true;
        if(patternForm.workplaceId === w.id){ const a = activeWorkplaces()[0]; if(a) patternForm.workplaceId = a.id; }
        saveState(); render();
      }, 'Убрать');
    },
    restoreWorkplace(id){
      const w = getWorkplace(id);
      if(!w) return;
      if(activeWorkplaces().length >= 10){ showAlert('Уже 10 текущих мест работы — сначала убери одно из них.'); return; }
      w.archived = false;
      saveState(); render();
    }
  };

  Object.assign(window.WC, importActions);

  // Safari присылает отдельные события для щипка — отменяем их, чтобы экран не масштабировался
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, { passive:false });
  });

  // Свайп влево/вправо — следующий/предыдущий месяц (в календаре, отчётах и во всплывающем выборе даты).
  // Этот же обработчик touchstart нужен iOS, чтобы показывать :active-состояние кнопок.
  let sw = null;
  document.addEventListener('touchstart', function(e){
    sw = null;
    if(e.touches.length !== 1) return;
    const t = e.target;
    if(t.closest('input, textarea, .tab-bar-wrap, .update-toast, .color-swatches')) return;
    let ctx = null;
    if(t.closest('.confirm-overlay')){ if(datePickerState) ctx = 'picker'; }
    else if(!confirmState && !paymentFormState && (currentTab==='calendar' || currentTab==='reports')) ctx = 'page';
    if(!ctx) return;
    sw = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now(), ctx: ctx };
  }, { passive:true });
  document.addEventListener('touchend', function(e){
    if(!sw) return;
    const s = sw; sw = null;
    const tt = e.changedTouches && e.changedTouches[0]; if(!tt) return;
    const dx = tt.clientX - s.x, dy = tt.clientY - s.y;
    if(Date.now() - s.t > 700 || Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)*1.6) return;
    const dir = dx < 0 ? 1 : -1;
    if(s.ctx === 'picker') WC.datePickerNav(dir);
    else WC.shiftMonth(dir);
  }, { passive:true });
  document.addEventListener('touchcancel', function(){ sw = null; }, { passive:true });

  loadState();

  // После обновления: убираем служебную метку из адреса и коротко показываем результат
  if(canUpdate()){
    try{ if(/[?&]v=\d+/.test(location.search)) history.replaceState(null, '', siteBase()); }catch(e){}
    let from = null;
    try{ from = sessionStorage.getItem('wc-updated-from'); sessionStorage.removeItem('wc-updated-from'); }catch(e){}
    if(from){
      updateInfo.status = (from === APP_BUILD) ? 'same' : 'done';
      updateInfo.lastCheck = Date.now();
      render();
      setTimeout(function(){ if(updateInfo.status==='done' || updateInfo.status==='same'){ updateInfo.status='uptodate'; softRender(); } }, 4000);
    }
  }

  // Тихая проверка обновлений: через пару секунд после запуска и при возвращении в приложение
  // (не чаще раза в минуту). Ничего не блокирует — просто покажет плашку, если есть новая версия.
  if(canUpdate()){
    setTimeout(function(){ if(updateInfo.status==='idle') checkForUpdates(false); }, 2500);
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState==='visible' && Date.now()-updateInfo.lastCheck > 60000) checkForUpdates(false);
    });
  }
})();
</script>
</body>
</html>
