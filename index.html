    return { v:out, asp:w/h };
  }
  function buildDigitTemplates(){
    const fonts = ['"Times New Roman", Times, serif', 'Georgia, serif', 'Arial, Helvetica, sans-serif', 'Calibri, Carlito, sans-serif'];
    const c = document.createElement('canvas'); c.width = 64; c.height = 64;
    const ctx = c.getContext('2d', { willReadFrequently:true });
    const T = [];
    fonts.forEach(function(f){
      for(let d=0; d<10; d++){
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,64,64);
        ctx.fillStyle = '#fff'; ctx.font = '44px ' + f; ctx.textBaseline = 'middle';
        ctx.fillText(String(d), 14, 32);
        const px = ctx.getImageData(0,0,64,64).data, m = new Uint8Array(64*64);
        for(let i=0;i<m.length;i++) m[i] = px[i*4] > 128 ? 1 : 0;
        const g = normGlyph(m, 64, 64);
        if(g) T.push({ d:d, v:g.v, asp:g.asp });
      }
    });
    return T;
  }
  function classifyGlyph(mask, mw, mh, allowNarrowOne){
    if(!digitTemplates) digitTemplates = buildDigitTemplates();
    const g = normGlyph(mask, mw, mh);
    if(!g) return null;
    if(allowNarrowOne !== false && g.asp < 0.33) return { d:1, score:1 };
    let best = null;
    const mean = function(v){ let s=0; for(let i=0;i<v.length;i++) s+=v[i]; return s/v.length; };
    const ga = mean(g.v);
    digitTemplates.forEach(function(t){
      const ta = mean(t.v); let num = 0, da = 0, db = 0;
      for(let i=0;i<g.v.length;i++){ const a = g.v[i]-ga, b = t.v[i]-ta; num += a*b; da += a*a; db += b*b; }
      let c = num / Math.sqrt(da*db + 1e-6);
      c -= 0.6*Math.abs(Math.log((g.asp+0.05)/(t.asp+0.05)));
      if(!best || c > best.score) best = { d:t.d, score:c };
    });
    return best;
  }

  // ---------- чтение строки сотрудника ----------
  // Строка сотрудника по клеткам: границы клеток — по линиям сетки самой строки (учитывает наклон и перспективу),
  // содержимое каждой клетки читает нейросеть: пусто / «1» / число часов / надпись
  function readRow(P, H, nd, anchor, pitch, lines, words){
    const b = colPitch(H, nd);
    const xs0 = Math.max(0, Math.floor(xOfDay(H, 0.5) - 2)), xs1 = Math.min(P.W-1, Math.ceil(xOfDay(H, nd+0.5) + 2));
    const band = rowBand(lines, anchor.x, anchor.y, pitch, H.py[1] || 0);
    // клетки по умолчанию — из шапки
    const cellL = {}, cellR = {};
    for(let d=1; d<=nd; d++){ cellL[d] = xOfDay(H, d - 0.5); cellR[d] = xOfDay(H, d + 0.5); }
    // уточнение по вертикальным линиям этой строки
    try{
      const ch = regularChain(bandSeparators(P, band, xs0 - b, xs1 + b), 0.5*b);
      if(ch && ch.length >= 6){
        const offs = [];
        for(let j=0;j+1<ch.length;j++){ const t = dayOfX(H, (ch[j] + ch[j+1])/2, nd); offs.push(Math.round(t) - j); }
        const k0 = Math.round(median(offs));
        let agree = 0; offs.forEach(function(o){ if(o === k0) agree++; });
        if(agree >= 0.6*offs.length){
          const shift = [];
          for(let j=0;j+1<ch.length;j++){
            const d = j + k0; if(d < 1 || d > nd) continue;
            cellL[d] = ch[j]; cellR[d] = ch[j+1];
            shift.push((ch[j] + ch[j+1])/2 - xOfDay(H, d));
          }
          // дни за пределами найденной цепочки — со средним сдвигом
          const sh = shift.length ? median(shift) : 0;
          for(let d=1; d<=nd; d++){
            const j = d - k0;
            if(j < 0 || j + 1 >= ch.length){ cellL[d] = xOfDay(H, d - 0.5) + sh; cellR[d] = xOfDay(H, d + 0.5) + sh; }
          }
        }
      }
    }catch(e){}
    // границы клеток уточняем по самим вертикальным линиям рядом (тёмный столбец через всю строку)
    const G = P.G, Wd = P.W;
    const snap = function(x){
      // линия — тёмная почти во всех точках по высоте строки (цифра «1» у края — только в части)
      const r = Math.max(2, 0.14*b), cols = [], vals = [];
      for(let xi=Math.round(x - r); xi<=Math.round(x + r); xi++){
        const v = [];
        if(xi >= 1 && xi < Wd - 1){
          const t = band.top(xi), h = band.bot(xi) - t;
          for(let f=0.08; f<=0.921; f+=0.07){ const y = Math.round(t + f*h); if(y >= 0 && y < P.H) v.push(G[y*Wd + xi]); }
        }
        cols.push([xi, v]); v.forEach(function(q){ vals.push(q); });
      }
      if(!vals.length) return x;
      const bgv = percentile(vals, 75);
      let best = null;
      cols.forEach(function(c){
        if(!c[1].length) return;
        let k = 0; c[1].forEach(function(q){ if(q < bgv - 15) k++; });
        const fr = k/c[1].length;
        if(fr >= 0.85 && (!best || fr > best.fr + 0.05 || (Math.abs(fr - best.fr) <= 0.05 && Math.abs(c[0] - x) < Math.abs(best.x - x)))) best = { x:c[0], fr:fr };
      });
      return best ? best.x : x;
    };
    if(IMP_CFG.snap) for(let d=1; d<=nd; d++){ cellL[d] = snap(cellL[d]); cellR[d] = snap(cellR[d]); }
    const res = IMP_CFG.glyphRow ? readRowGlyphs(P, band, nd, cellL, cellR, b) : {};
    if(!IMP_CFG.glyphRow) for(let d=1; d<=nd; d++){
      const L = cellL[d], R = cellR[d], w = R - L;
      if(!(w > 3)) continue;
      const rc = readCellValue(P, band, L + IMP_CFG.inset*w, R - IMP_CFG.inset*w);
      if(!rc) continue;
      res[d] = rc.text ? 'text' : (rc.v == null ? '?' : rc.v);
    }
    // надпись через несколько клеток («отпуск», «предварительно») — это не смены
    for(let d=1; d<=nd; d++) if(res[d] === '?' && (res[d-1] === 'text' || res[d+1] === 'text')) res[d] = 'text';
    return { days:res, band:band, xs0:xs0, xs1:xs1, cellL:cellL, cellR:cellR };
  }
  function localInkMask(S0, w, n, R, lr0, lr1){
    // лёгкое сглаживание 3×3
    const S = new Float32Array(n*w);
    for(let r=0;r<n;r++) for(let i=0;i<w;i++){
      let s = 0, c = 0;
      for(let dr=-1;dr<=1;dr++){ const rr = r+dr; if(rr < 0 || rr >= n) continue; for(let di=-1;di<=1;di++){ const ii = i+di; if(ii < 0 || ii >= w) continue; s += S0[rr*w+ii]; c++; } }
      S[r*w+i] = s/c;
    }
    // местный фон: максимум яркости в окне ±R (разделимый фильтр)
    const T = new Float32Array(n*w), B = new Float32Array(n*w);
    for(let r=0;r<n;r++){ const o = r*w; for(let i=0;i<w;i++){ let m = 0; const a = Math.max(0, i-R), b = Math.min(w-1, i+R); for(let k=a;k<=b;k++) if(S[o+k] > m) m = S[o+k]; T[o+i] = m; } }
    for(let i=0;i<w;i++) for(let r=0;r<n;r++){ let m = 0; const a = Math.max(0, r-R), b = Math.min(n-1, r+R); for(let k=a;k<=b;k++) if(T[k*w+i] > m) m = T[k*w+i]; B[r*w+i] = m; }
    // уровень «чернил» — самое тёмное по середине строки рядом (±3R по ширине)
    const cmin = new Float32Array(w);
    for(let i=0;i<w;i++){ let m = 255; for(let r=lr0;r<=lr1;r++) if(S[r*w+i] < m) m = S[r*w+i]; cmin[i] = m; }
    const lo = slidingMin(cmin, 3*R);
    const M = new Uint8Array(n*w), soft = new Float32Array(n*w);
    for(let r=0;r<n;r++) for(let i=0;i<w;i++){
      const k = r*w+i, bg = B[k], c = bg - lo[i];
      if(c < 30) continue;
      if(S[k] < bg - Math.max(18, 0.4*c)) M[k] = 1;
      const t = (bg - S[k])/c; soft[k] = t <= 0.1 ? 0 : (t >= 0.8 ? 1 : (t - 0.1)/0.7);

  }
  // Тонкие длинные горизонтальные черты (обрывки линий, край заливки) — убираем; толстые штрихи цифр остаются
  function removeThinRuns(M, w, n, minLen){
    const kill = [];
    for(let r=0;r<n;r++) for(let i=0;i<w;){
      if(M[r*w+i]){
        let j = i; while(j+1 < w && M[r*w+j+1]) j++;
        if(j - i + 1 >= minLen){
          // в длинной черте убираем только тонкие места (толщиной 1–2 точки): тело цифры, через которое она проходит, остаётся
          for(let q=i;q<=j;q++){ let t = 1, u = r - 1; while(u >= 0 && M[u*w+q] && t < 4){ t++; u--; } u = r + 1; while(u < n && M[u*w+q] && t < 4){ t++; u++; } if(t <= 2) kill.push([r, q, q]); }
        }
        i = j+1;
      } else i++;
    }
    kill.forEach(function(k){ for(let q=k[1];q<=k[2];q++) M[k[0]*w+q] = 0; });
  }
  // Вся строка сразу: знаки (связные области) не режутся границами клеток, день — по центру знака
  function readRowGlyphs(P, band, nd, cellL, cellR, b){
    const xa = Math.max(0, cellL[1] - 0.3*b), xb = Math.min(P.W - 2, cellR[nd] + 0.3*b);
    const xm = (xa + xb)/2, hb = band.bot(xm) - band.top(xm);
    // мелкие строки читаем с увеличением (толстые после сглаживания штрихи слипаются)
    const ext = 0.25, hbS = Math.max(26, Math.min(44, Math.round(hb*0.85))), n = Math.round(hbS*(1 + 2*ext));
    const Z = sampleStrip(P, band, xa, xb, -ext, 1 + ext, n), w = Z.w, S = Z.S, step = Z.step;
    const rT = Math.floor(n*ext/(1 + 2*ext)) - 1, rB = Math.ceil(n*(1 + ext)/(1 + 2*ext)) + 1;
    const ra = Math.round(n*(ext + 0.05)/(1 + 2*ext)), rb = Math.round(n*(ext + 0.95)/(1 + 2*ext));
    // 1) вертикальные линии сетки: столбец темнее фона и выше, и ниже строки, и почти по всей её высоте
    const zt = new Float32Array(w), zb = new Float32Array(w);
    for(let i=0;i<w;i++){
      let a = 0, bb = 0; for(let r=0;r<rT;r++) a += S[r*w+i]; for(let r=rB;r<n;r++) bb += S[r*w+i];
      zt[i] = rT > 0 ? a/rT : 255; zb[i] = n - rB > 0 ? bb/(n - rB) : 255;
    }
    const inAll = []; for(let i=0;i<w;i+=2) for(let r=ra;r<=rb;r+=2) inAll.push(S[r*w+i]);
    const mi = percentile(inAll, 60), mt = percentile(zt, 60), mbq = percentile(zb, 60);
    const lineCol = new Uint8Array(w);
    // линии сетки бывают только у границ клеток
    const nearB = new Uint8Array(w), tolB = Math.max(2, 0.12*b/step);
    for(let d=1; d<=nd+1; d++){
      const xB = d <= nd ? cellL[d] : cellR[nd], ic = (xB - xa)/step;
      for(let i=Math.max(0, Math.floor(ic - tolB)); i<=Math.min(w-1, Math.ceil(ic + tolB)); i++) nearB[i] = 1;
    }
    for(let i=0;i<w;i++){
      if(!nearB[i]) continue;
      if(!(zt[i] < mt - 7 && zb[i] < mbq - 7)) continue;
      let c = 0, t = 0; for(let r=ra;r<=rb;r++){ t++; if(S[r*w+i] < mi - 7) c++; }
      if(c/t >= 0.8) lineCol[i] = 1;
    }
    // линия узкая; широкая тёмная полоса — это заливка (выходные), её не трогаем
    const maxLW = Math.max(3, 0.1*b/step);
    for(let i=0;i<w;){ if(lineCol[i]){ let j = i; while(j+1 < w && lineCol[j+1]) j++; if(j - i + 1 > maxLW) for(let q=i;q<=j;q++) lineCol[q] = 0; i = j+1; } else i++; }
    const S2 = new Float32Array(S);
    for(let i=0;i<w;i++) if(lineCol[i] || (i > 0 && lineCol[i-1]) || (i < w-1 && lineCol[i+1])){
      // заменяем на фон этого места (соседние столбцы), а не на общий
      let a = i - 2; while(a > 0 && (lineCol[a] || lineCol[a+1])) a--;
      let c = i + 2; while(c < w - 1 && (lineCol[c] || lineCol[c-1])) c++;
      for(let r=0;r<n;r++) S2[r*w+i] = Math.max(S[r*w+Math.max(0, a)], S[r*w+Math.min(w-1, c)]);
    }
    // 2) «чернила» — по местному фону: цифра — тонкий штрих темнее своего окружения;
    //    большая ровная заливка (выходные, выделение) внутри себя «чернилами» не считается
    const M = IMP_CFG.localInk ? localInkMask(S2, w, n, Math.max(3, Math.round(0.32*hbS)), Math.round(n*(ext + 0.15)/(1 + 2*ext)), Math.round(n*(ext + 0.85)/(1 + 2*ext)))
                               : inkMask({ S:S2, w:w, n:n }, true, n*(ext + 0.15)/(1 + 2*ext), n*(ext + 0.85)/(1 + 2*ext), P.scale >= 2 ? IMP_CFG.lowResRatio : 0.35);
    // горизонтальные линии: длинные сплошные отрезки (цифра не шире клетки)
    const maxRun = Math.max(8, 0.6*b/step);
    for(let r=0;r<n;r++) for(let i=0;i<w;){
      if(M[r*w+i]){ let j = i; while(j+1 < w && M[r*w+j+1]) j++; if(j - i + 1 > maxRun) for(let q=i;q<=j;q++) M[r*w+q] = 0; i = j+1; } else i++;
    }
    // и прерывистые линии: в пределах клетки строка почти вся тёмная (+ её размытые края); у краёв строки — хватает половины
    const yc0L = n*(ext + 0.2)/(1 + 2*ext), yc1L = n*(ext + 0.8)/(1 + 2*ext);
    for(let d=1; d<=nd; d++){
      const i0 = Math.max(0, Math.round((cellL[d] - xa)/step)), i1 = Math.min(w - 1, Math.round((cellR[d] - xa)/step));
      if(i1 - i0 < 3) continue;
      const cw = i1 - i0 + 1, rc = new Float32Array(n), kill = new Uint8Array(n);
      for(let r=0;r<n;r++){ let c = 0; for(let i=i0;i<=i1;i++) c += M[r*w+i]; rc[r] = c/cw; if(rc[r] >= ((r < yc0L || r > yc1L) ? 0.5 : 0.75)) kill[r] = 1; }
      for(let pass=0; pass<2; pass++) for(let r=0;r<n;r++) if(!kill[r] && rc[r] >= 0.35 && ((r > 0 && kill[r-1]) || (r < n-1 && kill[r+1]))) kill[r] = 1;
      for(let r=0;r<n;r++) if(kill[r]) for(let i=i0;i<=i1;i++) M[r*w+i] = 0;
    }
    for(let r=0;r<n;r++) if(r < ra || r > rb) for(let i=0;i<w;i++) M[r*w+i] = 0;
    // точное положение верхней и нижней линии в каждой клетке (полоса могла чуть сместиться) — всё за ними убираем
    const fRow = function(f){ return Math.round(n*(ext + f)/(1 + 2*ext)); };
    {
      // сначала — по всей строке: линия идёт через все клетки, поэтому даже бледная она темнее фона почти во всех столбцах,
      // а строка с цифрами — только в немногих
      const colBg = new Float32Array(w), colTmp = new Float32Array(n);
      for(let i=0;i<w;i++){ for(let r=0;r<n;r++) colTmp[r] = S2[r*w+i]; colBg[i] = percentile(colTmp, 75); }
      const cover = new Float32Array(n);
      for(let r=0;r<n;r++){ let c = 0; for(let i=0;i<w;i++) if(S2[r*w+i] < colBg[i] - 10) c++; cover[r] = c/w; }
      let tA = -1, bA = -1;
      for(let r=Math.max(0, fRow(-0.15)); r<=fRow(0.22); r++) if(cover[r] >= 0.55) tA = r;
      for(let r=Math.min(n - 1, fRow(1.15)); r>=fRow(0.78); r--) if(cover[r] >= 0.55) bA = r;
      if(tA >= 0) for(let r=0;r<=tA+1;r++) for(let i=0;i<w;i++) M[r*w+i] = 0;
      if(bA >= 0) for(let r=bA-1;r<n;r++) for(let i=0;i<w;i++) M[r*w+i] = 0;
    }
    for(let d=1; d<=nd; d++){
      const i0 = Math.max(0, Math.round((cellL[d] - xa)/step) + 1), i1 = Math.min(w - 1, Math.round((cellR[d] - xa)/step) - 1);
      if(i1 - i0 < 3) continue;
      const cw = i1 - i0 + 1, rm = new Float32Array(n);
      for(let r=0;r<n;r++){ let sm = 0; for(let i=i0;i<=i1;i++) sm += S2[r*w+i]; rm[r] = sm/cw; }

  // Насколько часто такое значение встречается в графиках смен: «1» — смена, 8/10/11/12 — обычные часы

  function findHeaderOwn(P){
    const segW = Math.max(16, Math.round(P.W/48));

    const dbg = { lines:lines.length }; if(window.__WC_TEST__) findHeaderOwn.dbg = dbg;
    if(lines.length < 3) return null;
    const xc = P.W/2;
    const ord = lines.slice().sort(function(a, b){ return lineY(a, xc) - lineY(b, xc); });
    const bands = [];
    for(let i=0;i+1<ord.length;i++){
      const A = ord[i], B = ord[i+1];
      if(Math.min(A.x1, B.x1) - Math.max(A.x0, B.x0) < P.W*0.15) continue;

    let best = null;

    const refs = [good[0]].concat(bands[0] !== good[0] ? [bands[0]] : []);
    const longest = bands.reduce(function(m, b){ return b.chain.length > m.chain.length ? b : m; }, bands[0]);
    const offMin = -3.25 - Math.max(0, Math.round((good[0].band.top(P.W/2) - bands[0].band.top(P.W/2))/gm));
    for(let bi=0; bi<refs.length && !(best && best.m >= 0.6*best.n); bi++){
      const bd = refs[bi], ch = longest.chain.length > 1.3*bd.chain.length ? longest.chain : bd.chain, xm = (ch[0] + ch[ch.length-1])/2;
      for(let off=(bi === 0 ? offMin : -3.25); off<=5.01; off+=0.25){
        const t0 = bd.band.top(xm) + off*gm;
        if(tried.some(function(t){ return Math.abs(t - t0) < 0.2*gm; })) continue;
        tried.push(t0);

        cys.push(c.cy);

  }

    for(let i=1;i<=m;i++){
      cur[0] = i;
      for(let j=1;j<=n;j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1] ? 0 : 1));
      const t = prev; prev = cur; cur = t;
    }
    return prev[n];
  }
  function sim(a, b){ if(!a || !b) return 0; return 1 - lev(a, b)/Math.max(a.length, b.length); }
  function findPerson(words, fio){
    const parts = String(fio||'').trim().split(/\s+/).map(normRu).filter(Boolean);
    if(!parts.length) return null;
    const sur = parts[0], first = parts[1] || '';
    const ws = words.map(function(w){ return Object.assign({ n:normRu(w.text) }, w); }).filter(function(w){ return w.n.length >= 2 && /[а-я]/.test(w.n); });
    let best = null, second = null;
    ws.forEach(function(w){
      let s1 = sim(w.n, sur);
      if(sur.length >= 5 && w.n.length >= 5 && w.n.slice(0,5) === sur.slice(0,5)) s1 = Math.max(s1, 0.8);
      if(s1 < 0.6) return;
      let s2 = first ? 0 : 0.6, firstWord = '';
      ws.forEach(function(o){
        if(o === w || Math.abs(o.yc - w.yc) > 0.6*Math.max(w.h, o.h) || o.x0 <= w.x0 || o.x0 - w.x1 > 12*w.h) return;
        let s = sim(o.n, first);
        if(first && o.n.length <= 2 && o.n[0] === first[0]) s = Math.max(s, 0.7); // инициал «В.»
        if(s > s2){ s2 = s; firstWord = o.text; }
      });
      const score = s1 + s2;
      const cand = { score:score, s1:s1, s2:s2, x:w.xc, y:w.yc, h:w.h, label:(w.text + (firstWord ? ' ' + firstWord : '')) };
      if(!best || score > best.score){ if(best && Math.abs(best.y - cand.y) > 0.5*cand.h) second = best; best = cand; }
      else if(Math.abs(best.y - cand.y) > 0.5*best.h && (!second || score > second.score)) second = cand;
    });
    if(!best || best.s1 < 0.6 || (first && best.s2 < 0.55)) return null;
    // только инициал совпал — мало (однофамильцы с тем же инициалом встречаются): не угадываем
    if(first && best.s2 < 0.75) return null;
    // вторая строка с почти такой же оценкой — неоднозначно, пусть человек выберет сам
    if(second && second.score > best.score - 0.15 && Math.abs(second.y - best.y) > 0.5*best.h) return null;
    return best;
  }

  // ================= собственное распознавание слов («поиск слова по образцу») =================
  // Не зависит от того, как движок OCR прочитал кириллицу: нужное слово (фамилию, имя, месяц, день недели)
  // рисуем сами несколькими шрифтами и сравниваем его «силуэт» со словами на фото.
  const SPOT_FONTS = [
    '"Times New Roman", "Liberation Serif", Times, serif',
    'Arial, "Liberation Sans", Helvetica, sans-serif',
    'Calibri, Carlito, "Helvetica Neue", sans-serif',
    'Verdana, "DejaVu Sans", sans-serif'
  ];
  const SPOT_H = 16, SPOT_W = 48;
  const spotTplCache = {};

  // Выпрямленная полоса с квадратными «пикселями»: n строк между долями f0..f1 высоты полосы
  function sampleStrip(P, band, xa, xb, f0, f1, n){
    const G = P.G, W = P.W, Hh = P.H;
    const xm = (xa + xb)/2, h0 = Math.max(1, band.bot(xm) - band.top(xm));
    const step = Math.max(0.35, h0*(f1 - f0)/Math.max(1, n - 1));
    const w = Math.max(1, Math.min(6000, Math.floor((xb - xa)/step)));
    const S = new Float32Array(n*w);
    for(let i=0;i<w;i++){
      const x = xa + i*step, t = band.top(x), h = band.bot(x) - t;
      let xi = Math.floor(x), fx = x - xi;
      if(xi < 0){ xi = 0; fx = 0; } if(xi > W-2){ xi = W-2; fx = 1; }
      for(let r=0;r<n;r++){
        const y = t + (f0 + (f1 - f0)*(n > 1 ? r/(n-1) : 0))*h;
        let y0 = Math.floor(y), fy = y - y0;
        if(y0 < 0){ y0 = 0; fy = 0; } if(y0 > Hh-2){ y0 = Hh-2; fy = 1; }
        const k = y0*W + xi;
        S[r*w+i] = (G[k]*(1-fx) + G[k+1]*fx)*(1-fy) + (G[k+W]*(1-fx) + G[k+W+1]*fx)*fy;
      }
    }
    return { S:S, w:w, n:n, step:step, xa:xa };
  }

  // Бинаризация полосы: фон — свой для каждого столбца (цветная заливка, тени), «чернила» — заметно темнее фона.
  // Длинные горизонтальные и вертикальные отрезки (линии сетки) убираем.
  function slidingMin(arr, r){
    const n = arr.length, out = new Float32Array(n);
    for(let i=0;i<n;i++){ let m = 1e9; const a = Math.max(0, i-r), b = Math.min(n-1, i+r); for(let k=a;k<=b;k++) if(arr[k] < m) m = arr[k]; out[i] = m; }
    return out;
  }
  function inkMask(Z, keepVertical, lr0, lr1, ratio, lc0, lc1){
    const S0 = Z.S, w = Z.w, n = Z.n, kr = ratio || 0.45;
    lr0 = lr0 == null ? 0 : Math.max(0, lr0|0); lr1 = lr1 == null ? n - 1 : Math.min(n - 1, lr1|0);
    // лёгкое сглаживание 3×3 — против шума и зерна
    const S = new Float32Array(n*w);
    for(let r=0;r<n;r++) for(let i=0;i<w;i++){
      let s = 0, c = 0;
      for(let dr=-1;dr<=1;dr++){ const rr = r+dr; if(rr < 0 || rr >= n) continue;
        for(let di=-1;di<=1;di++){ const ii = i+di; if(ii < 0 || ii >= w) continue; s += S0[rr*w+ii]; c++; } }
      S[r*w+i] = s/c;
    }
    const bg = new Float32Array(w), cmin = new Float32Array(w), col = new Float32Array(n);
    for(let i=0;i<w;i++){ let mn = 255; for(let r=0;r<n;r++){ const v = S[r*w+i]; col[r] = v; if(r >= lr0 && r <= lr1 && v < mn) mn = v; } bg[i] = percentile(col, 80); cmin[i] = mn; }
    // уровень «чернил» — самый тёмный штрих поблизости (а не во всём кадре: тёмный стол рядом не мешает);
    // для клетки — только по её середине (линии сетки у краёв темнее цифр и сбили бы порог)
    let lo;
    if(lc0 != null){
      let m = 255; for(let i=Math.max(0, lc0|0); i<=Math.min(w-1, lc1|0); i++) if(cmin[i] < m) m = cmin[i];
      lo = new Float32Array(w).fill(m);
    } else lo = slidingMin(cmin, n);
    const M = new Uint8Array(n*w), soft = new Float32Array(n*w);
    for(let i=0;i<w;i++){
      const c = bg[i] - lo[i]; if(c < 30) continue;
      const thr = bg[i] - Math.max(16, kr*c);
      for(let r=0;r<n;r++){
        const v = S[r*w+i];
        if(v < thr) M[r*w+i] = 1;
        const t = (bg[i] - v)/c; soft[r*w+i] = t <= 0.1 ? 0 : (t >= 0.8 ? 1 : (t - 0.1)/0.7);
      }
    }
    M.soft = soft;
    // горизонтальные линии: сплошной отрезок длиннее 1.6 высоты полосы
    const maxH = Math.round(1.6*n);
    for(let r=0;r<n;r++){
      for(let i=0;i<w;){
        if(M[r*w+i]){ let j = i; while(j+1 < w && M[r*w+j+1]) j++; if(j - i + 1 > maxH) for(let q=i;q<=j;q++) M[r*w+q] = 0; i = j+1; }
        else i++;
      }
    }
    // вертикальные линии: столбец почти целиком тёмный
    if(!keepVertical) for(let i=0;i<w;i++){
      let c = 0; for(let r=0;r<n;r++) c += M[r*w+i];
      if(c >= 0.8*n) for(let r=0;r<n;r++) M[r*w+i] = 0;
    }
    return M;
  }

  // Связные области (8-связность): метки и рамки
  function components(M, w, n, minArea){
    const L = new Int32Array(w*n), comps = [], stack = [];
    let id = 0;
    for(let s=0;s<w*n;s++){
      if(!M[s] || L[s]) continue;
      id++; let x0 = w, x1 = -1, y0 = n, y1 = -1, area = 0;
      stack.length = 0; stack.push(s); L[s] = id;
      while(stack.length){
        const k = stack.pop(), x = k % w, y = (k - x)/w;
        area++; if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y;
        for(let dy=-1; dy<=1; dy++){ const yy = y+dy; if(yy < 0 || yy >= n) continue;
          for(let dx=-1; dx<=1; dx++){ const xx = x+dx; if(xx < 0 || xx >= w) continue;
            const q = yy*w + xx; if(M[q] && !L[q]){ L[q] = id; stack.push(q); } } }
      }
      comps.push({ id:id, x0:x0, x1:x1, y0:y0, y1:y1, area:area });
    }
    return { L:L, comps:comps.filter(function(c){ return c.area >= minArea; }) };
  }

  // Образ слова: маска → 16×48, лёгкое размытие, нормировка (для корреляции)
  function blurVec(v, W, H){
    const k = [0.054, 0.244, 0.403, 0.244, 0.054], t = new Float32Array(v.length);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){ let s = 0, c = 0; for(let d=-2;d<=2;d++){ const xx = x+d; if(xx < 0 || xx >= W) continue; s += v[y*W+xx]*k[d+2]; c += k[d+2]; } t[y*W+x] = s/c; }
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){ let s = 0, c = 0; for(let d=-2;d<=2;d++){ const yy = y+d; if(yy < 0 || yy >= H) continue; s += t[yy*W+x]*k[d+2]; c += k[d+2]; } v[y*W+x] = s/c; }
  }
  function maskVec(get, x0, x1, y0, y1, TH, TW){
    const w = x1 - x0 + 1, h = y1 - y0 + 1; if(w < 2 || h < 3) return null;
    TH = TH || SPOT_H; TW = TW || SPOT_W;
    const v = new Float32Array(TH*TW);
    for(let ty=0; ty<TH; ty++){
      const sy0 = y0 + ty*h/TH, sy1 = y0 + (ty+1)*h/TH;
      for(let tx=0; tx<TW; tx++){
        const sx0 = x0 + tx*w/TW, sx1 = x0 + (tx+1)*w/TW;
        let s = 0, c = 0;
        for(let y=Math.floor(sy0); y<sy1; y++){
          const wy = Math.min(y+1, sy1) - Math.max(y, sy0); if(wy <= 0) continue;
          for(let x=Math.floor(sx0); x<sx1; x++){
            const wx = Math.min(x+1, sx1) - Math.max(x, sx0); if(wx <= 0) continue;
            s += get(x, y)*wx*wy; c += wx*wy;
          }
        }
        v[ty*TW+tx] = c ? s/c : 0;
      }
    }
    blurVec(v, TW, TH);
    let m = 0; for(let i=0;i<v.length;i++) m += v[i]; m /= v.length;
    let q = 0; for(let i=0;i<v.length;i++){ v[i] -= m; q += v[i]*v[i]; }
    q = Math.sqrt(q) || 1; for(let i=0;i<v.length;i++) v[i] /= q;
    return { v:v, asp:w/h };
  }
  function vecDist1(A, B){
    let c = 0; const a = A.v, b = B.v; for(let i=0;i<a.length;i++) c += a[i]*b[i];
    return (1 - c) + 0.45*Math.abs(Math.log(A.asp/B.asp));
  }
  function vecDist(A, B){
    const d1 = vecDist1(A, B);
    if(SPOT_MODE === 0 || !A.line || !B.line) return d1;
    const d2 = vecDist1(A.line, B.line);
    return SPOT_MODE === 1 ? d2 : (SPOT_MODE === 2 ? 0.5*(d1 + d2) : Math.min(d1, d2));
  }
  let SPOT_MODE = 3;
  const IMP_CFG = { inset:0.04, snap:true, zoneLines:true, glyphRow:true, localInk:false, maxChan:true, surFloor:0, lowResRatio:0.45 };
  function aspFits(asp, T){ return T && asp >= 0.65*T.asp && asp <= 1.5*T.asp; }

  // Эталон слова: рисуем шрифтом на холсте
  const capCache = {};
  function capHeightOf(font, bold, fsz){
    const key = (bold ? 'b' : '') + font + '|' + fsz.toFixed(1);
    if(capCache[key]) return capCache[key];
    const c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently:true });
    const W = Math.ceil(fsz*2), Hc = Math.ceil(fsz*2);
    c.width = W; c.height = Hc;
    ctx.font = (bold ? 'bold ' : '') + fsz.toFixed(1) + 'px ' + font; ctx.fillStyle = '#000'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('Н', fsz*0.25, fsz*1.35);
    const d = ctx.getImageData(0, 0, W, Hc).data;
    let y0 = Hc; for(let y=0;y<Hc;y++){ for(let x=0;x<W;x++) if(d[(y*W+x)*4+3] > 127){ y0 = y; break; } if(y0 < Hc) break; }
    const h = Math.max(1, fsz*1.35 - y0);
    capCache[key] = h;
    return h;
  }
  function spotTemplate(text, font, bold, lowCap, up){
    // lowCap — высота заглавной буквы на исходном (мелком) фото в пикселях: тогда рисуем эталон так же мелко
    // и увеличиваем, как увеличивалось фото, — эталон «теряет» те же детали, что и снимок
    const low = lowCap && lowCap < 15 && up > 1.15;
    const lc = low ? Math.round(lowCap*2)/2 : 0, uq = low ? Math.round(up*4)/4 : 0;
    const key = (bold ? 'b|' : '') + font + '|' + text + (low ? '|' + lc + '|' + uq : '');
    if(key in spotTplCache) return spotTplCache[key];
    const c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently:true });
    const fsz = low ? Math.max(4, lc/0.7) : 64;
    const f = (bold ? 'bold ' : '') + fsz.toFixed(1) + 'px ' + font;
    ctx.font = f;
    let tw = Math.ceil(ctx.measureText(text).width + fsz*0.5), th = Math.ceil(fsz*1.9);
    c.width = tw; c.height = th;
    ctx.font = f; ctx.fillStyle = '#000'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(text, fsz*0.25, fsz*1.35);
    let src = c;
    if(low){
      const c2 = document.createElement('canvas'); c2.width = Math.round(tw*uq); c2.height = Math.round(th*uq);
      const x2 = c2.getContext('2d', { willReadFrequently:true }); x2.imageSmoothingEnabled = true; x2.imageSmoothingQuality = 'high';
      x2.drawImage(c, 0, 0, c2.width, c2.height);
      src = c2; tw = c2.width; th = c2.height;
    }
    const d = src.getContext('2d', { willReadFrequently:true }).getImageData(0, 0, tw, th).data;
    let x0 = tw, x1 = -1, y0 = th, y1 = -1;
    const thrA = low ? 70 : 127;
    for(let y=0;y<th;y++) for(let x=0;x<tw;x++) if(d[(y*tw+x)*4+3] > thrA){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
    const softA = function(a){ const t = a/255; return t <= 0.1 ? 0 : (t >= 0.8 ? 1 : (t - 0.1)/0.7); };
    const getT = function(x, y){ return (y < 0 || y >= th) ? 0 : softA(d[(y*tw+x)*4+3]); };
    const r = x1 < 0 ? null : maskVec(getT, Math.max(0, x0-1), Math.min(tw-1, x1+1), Math.max(0, y0-1), Math.min(th-1, y1+1));
    if(r){
      // высота заглавной этого шрифта (по букве «Н») и базовая линия — для «вида по линии письма»
      const capPx = capHeightOf(font, bold, fsz)*(low ? uq : 1), basePx = fsz*1.35*(low ? uq : 1);
      const lt = Math.round(basePx - capPx + 1), lb = Math.round(basePx + 0.3*capPx);
      const lv = maskVec(getT, Math.max(0, x0-1), Math.min(tw-1, x1+1), lt, lb);
      if(lv){ lv.asp = (Math.min(tw-1, x1+1) - Math.max(0, x0-1) + 1)/(1.3*capPx); r.line = lv; }
    }
    spotTplCache[key] = r;
    return r;
  }


  // Фрагменты строки: связные области, слитые по горизонтальному перекрытию (й, ё, ы — одним куском)
  function stripFragments(Z){
    const M = inkMask(Z), w = Z.w, n = Z.n;
    // остатки горизонтальных линий сетки (прерывистые): строка, тёмная на большей части ширины;
    // у верхнего и нижнего края полосы хватает и трети ширины — там только линии, а не буквы
    const cov = new Float32Array(n);
    for(let r=0;r<n;r++){ let c = 0; for(let i=0;i<w;i++) c += M[r*w+i]; cov[r] = c/w; }
    let cutTop = -1, cutBot = n;
    // линия — тонкая: заметно темнее соседних строк (строка букв так не выглядит)
    const thinLine = function(r, inward){ const q = r + inward*3; return cov[r] >= 0.35 && (q < 0 || q >= n || cov[q] < 0.5*cov[r]); };
    for(let r=0;r<Math.round(0.18*n);r++) if(thinLine(r, 1)) cutTop = r;
    for(let r=n-1;r>=Math.round(0.82*n);r--) if(thinLine(r, -1)) cutBot = r;
    for(let r=0;r<n;r++) if(r <= cutTop || r >= cutBot || cov[r] >= 0.55) for(let i=0;i<w;i++) M[r*w+i] = 0;
    const cc = components(M, w, n, Math.max(3, Math.round(0.004*n*n)));
    let comps = cc.comps.filter(function(c){ const hh = c.y1-c.y0+1, ww = c.x1-c.x0+1; return !(hh >= 0.92*n && ww <= 0.2*n) && !(ww > 2.5*n && hh < 0.2*n); });
    const hs = comps.map(function(c){ return c.y1 - c.y0 + 1; }).filter(function(v){ return v >= 0.25*n; });
    const capH = hs.length ? percentile(hs, 70) : 0.4*n;
    // крошки у края полосы (обрывки линий) и совсем мелкий мусор — не буквы
    comps = comps.filter(function(c){
      const hh = c.y1 - c.y0 + 1;
      if((c.y0 <= 1 || c.y1 >= n - 2) && hh < 0.3*n) return false;   // обрывок линии у края
      return c.area >= Math.max(3, 0.01*capH*capH);
    });
    // строка текста — там, где больше всего «чернил»; далёкие от неё кусочки отбрасываем
    const rowInk = new Float32Array(n);
    comps.forEach(function(c){ if(c.y1 - c.y0 + 1 >= 0.25*n) for(let y=c.y0;y<=c.y1;y++) rowInk[y] += c.area; });
    let yc = 0, ys = 0; for(let y=0;y<n;y++){ yc += y*rowInk[y]; ys += rowInk[y]; }
    const yMid = ys ? yc/ys : n/2;
    comps = comps.filter(function(c){ return c.y1 >= yMid - 1.1*capH && c.y0 <= yMid + 1.1*capH; });
    comps.sort(function(a, b){ return a.x0 - b.x0; });
    const fr = [];
    comps.forEach(function(c){
      const f = fr[fr.length-1];
      const vgap = f ? Math.max(0, Math.max(f.y0, c.y0) - Math.min(f.y1, c.y1)) : 0;
      if(f && c.x0 <= f.x1 - 0.3*(c.x1 - c.x0 + 1) && vgap <= 0.45*capH){
        if(c.x1 > f.x1) f.x1 = c.x1; if(c.y0 < f.y0) f.y0 = c.y0; if(c.y1 > f.y1) f.y1 = c.y1; f.ids[c.id] = 1;
      } else { const o = { x0:c.x0, x1:c.x1, y0:c.y0, y1:c.y1, ids:{} }; o.ids[c.id] = 1; fr.push(o); }
    });
    // линия письма строки: базовая линия (низ большинства букв) и высота заглавных
    let base = n*0.75, ch = capH;
    const lett = comps.filter(function(c){ return c.y1 - c.y0 + 1 >= 0.4*capH; });
    if(lett.length >= 2){
      base = median(lett.map(function(c){ return c.y1; }));
      const hts = lett.filter(function(c){ return Math.abs(c.y1 - base) <= 0.15*capH; }).map(function(c){ return base - c.y0 + 1; });
      if(hts.length) ch = Math.max(0.5*capH, percentile(hts, 90));
    }
    return { fr:fr, L:cc.L, w:w, n:n, capH:capH, M:M, soft:M.soft, base:base, ch:ch };
  }
  // Участки из нескольких соседних фрагментов (слово могло распасться на буквы или слиться с соседним)
  function gapSplit(gaps, capH){
    // порог «промежуток между буквами / между словами» — делим промежутки строки на две группы (метод Оцу)
    const g = gaps.filter(function(v){ return v < 1.5*capH; }).sort(function(a, b){ return a - b; });
    let thr = 0.3*capH;
    if(g.length >= 3){
      let best = -1;
      for(let i=1;i<g.length;i++){
        const a = g.slice(0, i), b = g.slice(i);
        const ma = a.reduce(function(s, v){ return s + v; }, 0)/a.length, mb = b.reduce(function(s, v){ return s + v; }, 0)/b.length;
        const between = a.length*b.length*(ma - mb)*(ma - mb);
        if(between > best){ best = between; thr = (g[i-1] + g[i])/2; }
      }
    }
    return Math.max(0.16*capH, Math.min(0.45*capH, thr));
  }
  function fragSpans(F){
    const fr = F.fr, N = fr.length, capH = F.capH, gaps = [], spans = [];
    for(let i=0;i<N-1;i++) gaps.push(fr[i+1].x0 - fr[i].x1);
    const wg = gapSplit(gaps, capH);
    for(let a=0;a<N;a++){
      let y0 = fr[a].y0, y1 = fr[a].y1;
      const inner = [];
      for(let b=a; b<Math.min(N, a+14); b++){
        if(b > a){ if(gaps[b-1] > 0.9*capH) break; inner.push(gaps[b-1]); y0 = Math.min(y0, fr[b].y0); y1 = Math.max(y1, fr[b].y1); }
        if(y1 - y0 + 1 < 0.45*capH) continue;
        // граница слова: промежуток снаружи заметно больше, чем между буквами внутри
        const gm = inner.length ? median(inner) : null;
        const thr = Math.min(0.4*capH, gm != null ? Math.max(1.3*gm + 1, 0.1*capH) : Math.max(wg, 0.18*capH));
        const gb = a > 0 ? gaps[a-1] : 1e9, ga = b < N-1 ? gaps[b] : 1e9;
        spans.push({ a:a, b:b, pen:(gb < thr ? 0.25 : 0) + (ga < thr ? 0.25 : 0), asp:(fr[b].x1 - fr[a].x0 + 1)/(y1 - y0 + 1), vec:undefined });
      }
    }
    return spans;
  }
  function spanVec(F, sp){
    if(sp.vec !== undefined) return sp.vec;
    const fr = F.fr, ids = {}; let x1 = fr[sp.a].x1, y0 = 1e9, y1 = -1;
    for(let k=sp.a;k<=sp.b;k++){ const f = fr[k]; if(f.x1 > x1) x1 = f.x1; if(f.y0 < y0) y0 = f.y0; if(f.y1 > y1) y1 = f.y1; for(const id in f.ids) ids[id] = 1; }
    const L = F.L, w = F.w, n = F.n, soft = F.soft;
    // мягкая маска: яркость «чернил» у пикселей слова и их соседей (сохраняет форму мелкого текста)
    const x0 = Math.max(0, fr[sp.a].x0 - 1), xe = Math.min(w - 1, x1 + 1), ya = Math.max(0, y0 - 1), ye = Math.min(n - 1, y1 + 1);
    const get = function(x, y){
      if(y < 0 || y >= n) return 0;
      const k = y*w + x;
      if(ids[L[k]] || (x > 0 && ids[L[k-1]]) || (x < w-1 && ids[L[k+1]]) || (y > 0 && ids[L[k-w]]) || (y < n-1 && ids[L[k+w]])) return soft ? soft[k] : 1;
      return 0;
    };
    sp.vec = maskVec(get, x0, xe, ya, ye);
    // второй взгляд: по высоте — строго по линии письма строки (не зависит от крошек и обрезанных букв)
    if(sp.vec && F.base != null){
      const lt = Math.round(F.base - F.ch + 1), lb = Math.round(F.base + 0.3*F.ch);
      const lv = maskVec(get, x0, xe, lt, lb);
      if(lv){ lv.asp = (xe - x0 + 1)/(1.3*F.ch); sp.vec.line = lv; }
    }
    return sp.vec;
  }

  // Строки таблицы (между соседними горизонтальными линиями)
  function tableRows(H, nd, lines, pitch){
    const xr = xOfDay(H, 0.5);
    const yHead = polyval(H.py, xr);
    const ys = lines.map(function(L){ return { y:lineY(L, xr), c:L }; }).sort(function(a, b){ return a.y - b.y; });
    const rows = [];
    for(let i=0;i+1<ys.length;i++){
      const a = ys[i], b = ys[i+1], g = b.y - a.y;
      if(g < 0.5*pitch) continue;
      const k = Math.max(1, Math.round(g/pitch));
      if(k > 3) continue;
      for(let q=0;q<k;q++){
        const ca = a.c, cb = b.c, f0 = q/k, f1 = (q+1)/k;
        const band = { top:function(x){ const t = lineY(ca, x); return t + (lineY(cb, x) - t)*f0; },
                       bot:function(x){ const t = lineY(ca, x); return t + (lineY(cb, x) - t)*f1; } };
        const yc = (band.top(xr) + band.bot(xr))/2;
        if(yc < yHead + 0.4*H.h) continue;      // шапка — не сотрудник
        rows.push({ band:band, y:yc });
      }
    }
    return rows;
  }

  function capWord(s){ s = String(s||'').toLowerCase(); return s ? s[0].toUpperCase() + s.slice(1) : s; }

  // Полоса с именем: окно высотой в строку, сдвинутое (в пределах трети строки) так, чтобы текст не обрезался
  function nameStrip(P, band, xa, xb, n){
    const n2 = Math.round(n*1.7);
    const T = sampleStrip(P, band, xa, xb, -0.35, 1.35, n2);
    const M = inkMask(T), w = T.w;
    const prof = new Float32Array(n2);
    for(let r=0;r<n2;r++){ let c = 0; for(let i=0;i<w;i++) c += M[r*w+i]; prof[r] = c/w >= 0.5 ? 0 : c; }   // линии не считаем
    const rowOf = function(f){ return Math.round((f + 0.35)/1.7*(n2 - 1)); };
    let bestO = 0, bestS = -1e9;
    for(let o=-0.3; o<=0.301; o+=0.05){
      const a = rowOf(o + 0.06), b = rowOf(o + 0.94);
      let inS = 0, edge = 0;
      for(let r=a;r<=b;r++) inS += prof[r];
      // штраф, если текст режется краем окна
      for(let r=Math.max(0, a-2); r<=a+1; r++) edge += prof[r];
      for(let r=b-1; r<=Math.min(n2-1, b+2); r++) edge += prof[r];
      const sc = inS - 3*edge - Math.abs(o)*0.02*inS;
      if(sc > bestS){ bestS = sc; bestO = o; }
    }
    return sampleStrip(P, band, xa, xb, bestO + 0.05, bestO + 0.95, n);
  }

  // Поиск строки сотрудника по ФИО без OCR: оценка для каждой строки (меньше — лучше)
  function spotPerson(P, H, nd, lines, pitch, fio){
    const parts = String(fio||'').trim().split(/\s+/).map(function(t){ return t.replace(/[^А-Яа-яЁё-]/g, ''); }).filter(Boolean);
    if(!parts.length) return null;
    const sur = capWord(parts[0]), first = parts[1] ? capWord(parts[1]) : '', pat = parts[2] ? capWord(parts[2]) : '';
    const b = colPitch(H, nd);
    const xb = xOfDay(H, 0.5) - 0.08*b, xa = Math.max(0, xOfDay(H, 0.5) - 16*b);
    const rows = tableRows(H, nd, lines, pitch);
    const I0 = first ? first[0] + '.' : '', J0 = pat ? pat[0] + '.' : '';
    const firstForms = first ? [first, I0].concat(J0 ? [I0 + J0, I0 + ' ' + J0, I0[0] + ' ' + J0[0], I0[0] + J0[0]] : []) : [];
    // эталоны: 4 шрифта × обычный/жирный (размытое фото «утолщает» буквы)
    const tplSet = function(lowCap){
      const out = [];
      SPOT_FONTS.forEach(function(f){ [false, true].forEach(function(bold){
        out.push({ sur:spotTemplate(sur, f, bold, lowCap, P.scale), first:firstForms.map(function(t){ return spotTemplate(t, f, bold, lowCap, P.scale); }).filter(Boolean),
                   pat:pat ? spotTemplate(pat, f, bold, lowCap, P.scale) : null });
      }); });
      return out;
    };
    return rows.map(function(row, ri){
      const hh = row.band.bot(xb) - row.band.top(xb);
      const n = Math.max(16, Math.min(56, Math.round(hh)));
      const Z = sampleStrip(P, row.band, xa, xb, 0.05, 0.95, n);
      const F = stripFragments(Z), fr = F.fr, capH = F.capH;
      // эталоны обычные и «мелкие» (как на маленьком фото) — берём то, что ближе
      const lowCap = 0.8*capH*Z.step/(P.scale || 1);
      const T = tplSet(0).concat(lowCap < 15 && P.scale > 1.15 ? tplSet(lowCap) : []);
      const spans = fragSpans(F);
      const after = function(bIdx){ return spans.filter(function(s2){ return s2.a === bIdx + 1 && fr[s2.a].x0 - fr[bIdx].x1 <= 1.5*capH; }); };
      let best = null;
      T.forEach(function(t, fi){
        if(!t.sur) return;
        spans.forEach(function(s1){
          if(!aspFits(s1.asp, t.sur)) return;
          const v1 = spanVec(F, s1); if(!v1) return;
          const ds = vecDist(v1, t.sur) + s1.pen;
          if(ds > 1.2) return;
          let df = first ? 1.2 : 0, fb = -1;
          if(first) after(s1.b).forEach(function(s2){
            t.first.forEach(function(tf){
              if(!aspFits(s2.asp, tf)) return;
              const v2 = spanVec(F, s2); if(!v2) return;
              const d = vecDist(v2, tf) + s2.pen;
              if(d < df){ df = d; fb = s2.b; }
            });
          });
          let bonus = 0;
          if(t.pat && fb >= 0){
            let dp = 1;
            after(fb).forEach(function(s3){ if(!aspFits(s3.asp, t.pat)) return; const v3 = spanVec(F, s3); if(v3){ const d = vecDist(v3, t.pat) + s3.pen; if(d < dp) dp = d; } });
            bonus = Math.min(dp, 0.5) - 0.5;
          }
          // хорошее совпадение фамилии дальше не «соревнуется» — у однофамильцев решает имя
          const sc = Math.max(ds, IMP_CFG.surFloor) + df + bonus;
          if(!best || sc < best.s) best = { s:sc, ds:ds, df:df, bonus:bonus, font:fi, x:xa + Z.step*(fr[s1.a].x0 + fr[s1.b].x1)/2 };
        });
      });
      return { i:ri, y:row.y, band:row.band, s:best ? best.s : 9, ds:best ? best.ds : 9, df:best ? best.df : 9, bonus:best ? best.bonus : 0, font:best ? best.font : -1, x:best ? best.x : xa, nFr:fr.length };
    });
  }

  // ---------- месяц своими силами: строка дней недели и название месяца над таблицей ----------
  const WD_NAMES = ['пн','вт','ср','чт','пт','сб','вс'];
  const MONTH_NOM = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
  function caseVariants(w){ return [w, w[0].toUpperCase() + w.slice(1), w.toUpperCase()]; }
  function wordTemplates(words){
    const out = [];
    words.forEach(function(w, idx){
      SPOT_FONTS.forEach(function(f){ [false, true].forEach(function(bold){ caseVariants(w).forEach(function(v){ const t = spotTemplate(v, f, bold); if(t) out.push({ idx:idx, t:t }); }); }); });
    });
    return out;
  }
  let wdTpl = null, monTpl = null;
  function spotWeekdays(P, H){
    if(!H || !H.chain || !H.band) return null;
    if(!wdTpl) wdTpl = wordTemplates(WD_NAMES);
    const ch = H.chain, g = H.g, B0 = H.band;
    let best = null;
    [1, -1, 0.75, -0.75, 1.25, -1.25].forEach(function(off){
      const win = { top:function(x){ return B0.top(x) + off*g; }, bot:function(x){ return B0.bot(x) + off*g; } };
      const D = [];
      for(let j=0;j+1<ch.length;j++){
        const d = j + H.k; if(d < 1 || d > 31) continue;
        const w = ch[j+1] - ch[j];
        const xm = (ch[j] + ch[j+1])/2; if(win.top(xm) < 0 || win.bot(xm) > P.H) continue;
        const n = Math.max(14, Math.min(40, Math.round(0.8*g)));
        const F = stripFragments(sampleStrip(P, win, ch[j] + 0.08*w, ch[j+1] - 0.08*w, 0.1, 0.9, n));
        if(!F.fr.length || F.fr.length > 6) continue;
        const sp = { a:0, b:F.fr.length - 1, vec:undefined }, v = spanVec(F, sp);
        if(!v) continue;
        const dist = [9,9,9,9,9,9,9];
        wdTpl.forEach(function(o){ const dd = vecDist(v, o.t); if(dd < dist[o.idx]) dist[o.idx] = dd; });
        D.push({ d:d, dist:dist });
      }
      if(D.length < 7) return;
      const tot = [];
      for(let o=0;o<7;o++){ let s = 0; D.forEach(function(e){ s += Math.min(1, e.dist[(o + e.d - 1) % 7]); }); tot.push(s/D.length); }
      const ord = tot.map(function(v, i){ return [v, i]; }).sort(function(a, b){ return a[0] - b[0]; });
      const r = { wd1:ord[0][1], score:ord[0][0], margin:ord[1][0] - ord[0][0], n:D.length, off:off };
      if(!best || r.margin > best.margin) best = r;
    });
    return best && best.margin >= 0.06 ? best : (best ? Object.assign(best, { weak:true }) : null);
  }
  function spotMonthTitle(P, H, nd){
    if(!H || !H.band) return null;
    if(!monTpl) monTpl = wordTemplates(MONTH_NOM);
    const yNow = new Date().getFullYear();
    const years = [yNow - 1, yNow, yNow + 1];
    const yTpl = [];
    years.forEach(function(y, idx){ SPOT_FONTS.forEach(function(f){ [false, true].forEach(function(bold){ const t = spotTemplate(String(y), f, bold); if(t) yTpl.push({ idx:idx, t:t }); }); }); });
    const b = colPitch(H, nd || 31), g = H.g, B0 = H.band;
    const xa = Math.max(0, xOfDay(H, 0.5) - 14*b), xb = Math.min(P.W - 1, xOfDay(H, (nd || 31) + 1.5));
    let bestM = null, bestY = null;
    const perM = new Array(12).fill(9);
    // строки текста над шапкой: ищем по горизонтальной проекции «чернил», затем каждую строку разбираем отдельно
    const top = function(x){ return B0.top(x) - 6*g; }, bot = function(x){ return B0.top(x) - 0.1*g; };
    const regTop = top((xa + xb)/2);
    const lines = [];
    if(regTop > -3*g){
      const nR = Math.max(40, Math.min(240, Math.round(5.9*g)));
      const reg = { top:function(x){ return Math.max(0, top(x)); }, bot:bot };
      const Z = sampleStrip(P, reg, xa, xb, 0, 1, nR);
      const M = inkMask(Z), w = Z.w;
      const prof = new Float32Array(nR);
      for(let r=0;r<nR;r++){ let c = 0; for(let i=0;i<w;i++) c += M[r*w+i]; prof[r] = c/w; }
      const hRow = (bot((xa+xb)/2) - reg.top((xa+xb)/2))/nR;   // пикселей фото на строку выборки
      for(let r=0;r<nR;){
        if(prof[r] > 0.004){ let j = r; while(j+1 < nR && prof[j+1] > 0.004) j++; const hh = (j - r + 1)*hRow; if(hh >= 0.25*g) lines.push([r*hRow, (j+1)*hRow]); r = j+1; }
        else r++;
      }
      lines.forEach(function(L){
        const y0 = L[0], y1 = L[1], hh = y1 - y0, pad = 0.3*hh;
        const win = { top:function(x){ return Math.max(0, top(x)) + y0 - pad; }, bot:function(x){ return Math.max(0, top(x)) + y1 + pad; } };
        const n = Math.max(18, Math.min(64, Math.round(hh + 2*pad)));
        const F = stripFragments(sampleStrip(P, win, xa, xb, 0, 1, n));
        if(!F.fr.length) return;
        fragSpans(F).forEach(function(sp){
          let v = null;
          monTpl.forEach(function(o){
            if(!aspFits(sp.asp, o.t)) return;
            v = v || spanVec(F, sp); if(!v) return;
            const d = vecDist(v, o.t) + sp.pen;
            if(d < perM[o.idx]) perM[o.idx] = d;
            if(!bestM || d < bestM.d) bestM = { d:d, m:o.idx };
          });
          yTpl.forEach(function(o){
            if(!aspFits(sp.asp, o.t)) return;
            v = v || spanVec(F, sp); if(!v) return;
            const d = vecDist(v, o.t) + sp.pen;
            if(!bestY || d < bestY.d) bestY = { d:d, y:years[o.idx] };
          });
        });
      });
    }
    let m2 = 9, m2i = -1; perM.forEach(function(d, i){ if(bestM && i !== bestM.m && d < m2){ m2 = d; m2i = i; } });
    const mMargin = bestM ? m2 - bestM.d : 0;
    // похожие названия («июнь»/«июль») — отдаём обоих кандидатов, решат дни недели и число дней
    const close = bestM && bestM.d < 0.3 && mMargin < 0.05;
    return { m:bestM && bestM.d < 0.45 && (mMargin >= 0.05 || close) ? bestM.m : -1, m2:close ? m2i : -1, mD:bestM ? bestM.d : 9, mMargin:mMargin,
             year:bestY && bestY.d < 0.35 ? bestY.y : null, yD:bestY ? bestY.d : 9 };
  }

  // Месяц без OCR: дни недели (+ число дней) и, если этого мало, название месяца над таблицей
  function ownMonthEvidence(P, H){
    const ev = { m:-1, year:null, wd1:-1 };
    let wd = null;
    try{ wd = spotWeekdays(P, H); }catch(e){ wd = null; }
    if(wd && !wd.weak){ ev.wd1 = wd.wd1; ev.wdStrong = wd.margin >= 0.12; ev.wdMargin = wd.margin; }
    // сколько месяцев рядом начинаются с того же дня недели — если один, название не нужно
    let same = 0;
    if(ev.wd1 >= 0){
      const now = new Date();
      for(let k=-6;k<=9;k++){ const dt = new Date(now.getFullYear(), now.getMonth()+k, 1); if((dt.getDay()+6) % 7 === ev.wd1) same++; }
    }
    if(ev.wd1 < 0 || same > 1 || (wd && wd.margin < 0.12)){
      let mt = null;
      try{ mt = spotMonthTitle(P, H, H.maxDay >= 28 ? H.maxDay : 31); }catch(e){ mt = null; }
      if(mt){ ev.m = mt.m; ev.m2 = mt.m2; ev.year = mt.year; ev.mStrong = mt.mD < 0.3 && mt.mMargin >= 0.08; ev.mMid = mt.mD < 0.2; ev.mD = mt.mD; ev.mMargin = mt.mMargin; }
    }
    return ev;
  }

  // ---------- месяц и год ----------
  function detectMonth(words, H, maxDay, own){
    words = words || []; own = own || {};
    const now = new Date();
    const names = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
    let nameM = -1, nameScore = 0, year = null;
    words.forEach(function(w){
      const t = normRu(w.text);
      names.forEach(function(nm, i){
        const s = t.length >= 3 ? sim(t, nm) : 0;
        if(s > nameScore && s >= (nm.length <= 4 ? 0.99 : 0.72)){ nameScore = s; nameM = i; }
      });
      const y = String(w.text).match(/\b(20\d\d)\b/);
      if(y) year = +y[1];
    });
    // день недели 1-го числа по подписям «пн вт ср…» под номерами дней
    const wdNames = ['пн','вт','ср','чт','пт','сб','вс'];
    const votes = [0,0,0,0,0,0,0];
    words.forEach(function(w){
      const idx = wdNames.indexOf(normRu(w.text));
      if(idx < 0 || !H) return;
      const d = Math.round(dayOfX(H, w.xc, 31));
      if(d >= 1 && d <= 31) votes[((idx - (d-1)) % 7 + 7) % 7]++;
    });
    const vmax = Math.max.apply(null, votes);
    let wd1 = vmax >= 2 ? votes.indexOf(vmax) : -1, wdW = 2;
    if(nameM < 0 && own.m >= 0) nameM = own.m;
    if(!year && own.year) year = own.year;
    if(wd1 < 0 && own.wd1 != null && own.wd1 >= 0){ wd1 = own.wd1; wdW = own.wdStrong ? 3 : 1.5; }
    // число дней: из шапки, если последние числа (28…31) прочитаны уверенно
    const nDays = (H && H.nDays) || 0;
    // название месяца из OCR — надёжно; своё (по образцу) — только как подсказка
    const nameW = nameScore > 0 ? 3 : (own.mStrong ? 1.5 : (own.mMid ? 1.0 : 0.4));
    const name2 = nameScore > 0 ? -1 : (own.m2 != null ? own.m2 : -1);
    const cand = [];
    for(let k=-12;k<=12;k++){
      const dt = new Date(now.getFullYear(), now.getMonth()+k, 1), m = dt.getMonth(), y = dt.getFullYear();
      let s = 0;
      if(nameM >= 0 && m === nameM) s += nameW;
      else if(name2 >= 0 && m === name2) s += 0.6*nameW;
      if(year) s += (y === year ? 1.5 : -1);
      if(wd1 >= 0) s += ((dt.getDay()+6) % 7) === wd1 ? wdW : -wdW;
      if(nDays) s += daysInMonth(y, m) === nDays ? 2 : -2;
      else if(maxDay >= 28 && daysInMonth(y, m) < maxDay) s -= 2;
      // обычно загружают график текущего или следующего месяца
      s += k === 0 || k === 1 ? 0.4 : (k === -1 ? 0.3 : (k === 2 ? 0.2 : -0.03*Math.abs(k) - (Math.abs(k) > 6 ? 0.3 : 0)));
      cand.push({ s:s, m:m, y:y });
    }
    cand.sort(function(a, b){ return b.s - a.s; });
    const best = cand[0];
    const sure = cand[1] ? best.s - cand[1].s >= 1.5 : true;
    return { month:best.m, year:best.y, sure:sure };
  }

  // ---------- превью строки для проверки ----------
  function rowPreview(P, H, nd, row, days){
    const hb = H.h, xs0 = row.xs0, xs1 = row.xs1;
    const header = { top:function(x){ return polyval(H.py, x) - 0.9*hb; }, bot:function(x){ return polyval(H.py, x) + 0.9*hb; } };
    const rh = Math.round(Math.max(16, row.band.bot(xs0) - row.band.top(xs0)) * 1.2);
    const hh = Math.round(1.8*hb);
    const A = sampleBand(P, header, xs0, xs1, 0, 1, hh), B = sampleBand(P, row.band, xs0, xs1, -0.1, 1.1, rh);
    const w = xs1 - xs0, target = 44, sc = target / Math.max(hh, rh);
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w*sc)); c.height = Math.round((hh + rh)*sc) + 4;
    const tmp = document.createElement('canvas'); tmp.width = w; tmp.height = hh + rh + 4;
    const tctx = tmp.getContext('2d'); const id = tctx.createImageData(w, hh + rh + 4);
    const put = function(Z, off){ for(let r=0;r<Z.n;r++) for(let i=0;i<w;i++){ const v = Z.S[r*w+i]; const k = ((r+off)*w + i)*4; id.data[k] = id.data[k+1] = id.data[k+2] = v; id.data[k+3] = 255; } };
    put(A, 0); put(B, hh + 4);
    for(let i=0;i<w;i++) for(let r=hh;r<hh+4;r++){ const k = (r*w+i)*4; id.data[k] = 255; id.data[k+1] = 149; id.data[k+2] = 0; id.data[k+3] = 255; }
    tctx.putImageData(id, 0, 0);
    const ctx = c.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(tmp, 0, 0, c.width, c.height);
    // отметки найденных смен под строкой
    Object.keys(days).forEach(function(k){
      const d = +k, x = (xOfDay(H, d) - xs0) * sc;
      ctx.fillStyle = days[d] === '?' ? '#FF9500' : '#39FF14';
      ctx.fillRect(x - 6, c.height - 3, 12, 3);
    });
    return c.toDataURL('image/jpeg', 0.85);
  }

  // ---------- весь процесс ----------
  function tick(){ return new Promise(function(r){ setTimeout(r, 16); }); }
  function rotateQuarter(img, dir){
    const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    const k = Math.min(1, 3000/Math.max(w, h));
    const c = document.createElement('canvas'); c.width = Math.round(h*k); c.height = Math.round(w*k);
    const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high';
    ctx.translate(c.width/2, c.height/2); ctx.rotate(dir*Math.PI/2);
    ctx.drawImage(img, -w*k/2, -h*k/2, w*k, h*k);
    return c;
  }
  // Картинка участка строки (для подтверждения «это ты?»)
  function stripImage(P, band, xa, xb, hOut){
    const hh = band.bot((xa+xb)/2) - band.top((xa+xb)/2);
    const n = Math.max(12, Math.min(64, Math.round(hh*1.1)));
    const Z = sampleStrip(P, band, xa, xb, -0.05, 1.05, n);
    const c = document.createElement('canvas'); c.width = Z.w; c.height = Z.n;
    const ctx = c.getContext('2d'), id = ctx.createImageData(Z.w, Z.n);
    for(let k=0;k<Z.S.length;k++){ const v = Z.S[k]; id.data[k*4] = id.data[k*4+1] = id.data[k*4+2] = v; id.data[k*4+3] = 255; }
    ctx.putImageData(id, 0, 0);
    const out = document.createElement('canvas'), sc = (hOut || 40)/Z.n;
    out.width = Math.max(1, Math.round(Z.w*sc)); out.height = Math.round(Z.n*sc);
    const o = out.getContext('2d'); o.imageSmoothingQuality = 'high'; o.drawImage(c, 0, 0, out.width, out.height);
    return out.toDataURL('image/jpeg', 0.85);
  }
  // Уверенно ли найдена строка: лучшая заметно лучше следующей
  function decidePerson(rows){
    const r = (rows || []).filter(function(x){ return x.s < 5; }).sort(function(a, b){ return a.s - b.s; });
    if(!r.length) return { ok:false, ranked:[] };
    const gap = r[1] ? r[1].s - r[0].s : 1;
    return { ok:r[0].s < 0.95 && gap >= 0.1, best:r[0], gap:gap, ranked:r };
  }
  function nameArea(D){
    const b = colPitch(D.H, D.nd);
    return { xa:Math.max(0, xOfDay(D.H, 0.5) - 16*b), xb:xOfDay(D.H, 0.5) - 0.08*b };
  }
  async function processImport(file){
    const run = ++impRun;
    const p = impProfile();
    imp = { stage:'loading', msg:'Открываю фото…', pct:5, result:null, pickUrl:null, error:null };
    render();
    try{
      const img = await loadImageFromFile(file);
      if(run !== impRun) return;
      imp.msg = 'Выравниваю фото…'; imp.pct = 15; softRender(); await tick();
      let P = prepImage(img);
      if(run !== impRun) return;
      imp.msg = 'Ищу таблицу и числа месяца…'; imp.pct = 35; softRender(); await tick();
      let H = null, words = null;
      try{ H = findHeaderOwn(P); }catch(e){ H = null; }
      // снято «боком» (телефон повёрнут) — пробуем повернуть на четверть оборота
      for(let q=0; !H && q<2; q++){
        if(run !== impRun) return;
        const rc = rotateQuarter(img, q === 0 ? 1 : -1);
        const P2 = prepImage(rc);
        let H2 = null; try{ H2 = findHeaderOwn(P2); }catch(e){ H2 = null; }
        if(H2){ P = P2; H = H2; }
      }
      if(run !== impRun) return;
      if(!H){
        // запасной путь — движок распознавания текста (скачивается один раз)
        imp.msg = 'Загружаю модуль распознавания…'; softRender();
        await ensureTesseract();
        if(run !== impRun) return;
        words = await runOCR(P.canvas, run);
        if(run !== impRun) return;
        H = fitHeader(words, P.W);
        if(!H) throw new Error('Не нашёл на фото шапку с номерами дней. Сфотографируй таблицу ровнее и так, чтобы строка с числами месяца попала в кадр.');
      }
      imp.msg = 'Определяю месяц…'; imp.pct = 55; softRender(); await tick();
      let ev = {};
      if(H.own){ try{ ev = ownMonthEvidence(P, H); }catch(e){ ev = {}; } }
      const mon = detectMonth(words, H, H.maxDay, ev);
      const nd = daysInMonth(mon.year, mon.month);
      const TG = tableGeometry(P, H, nd);
      if(run !== impRun) return;
      imp.msg = 'Ищу твою строку…'; imp.pct = 75; softRender(); await tick();
      let spot = null;
      try{ spot = spotPerson(P, H, nd, TG.lines, TG.pitch, p.fio); }catch(e){ spot = null; }
      impData = { P:P, words:words, H:H, nd:nd, lines:TG.lines, pitch:TG.pitch, month:mon };
      const dec = decidePerson(spot);
      imp.dbg = { spot:(dec.ranked || []).slice(0, 4).map(function(r){ return [r.i, +r.s.toFixed(3)]; }), gap:dec.gap, own:!!H.own, wd:ev.wd1, m:ev.m };
      if(dec.ok){
        const r = dec.best, y = (r.band.top(r.x) + r.band.bot(r.x))/2;
        finishImport({ x:r.x, y:y }, p.fio, false, r.band);
        return;
      }
      // не уверены — пробуем прочитать имена движком распознавания текста
      if(!words){
        try{
          imp.msg = 'Уточняю имя… (загружаю модуль распознавания)'; imp.pct = 85; softRender();
          await ensureTesseract();
          if(run !== impRun) return;
          words = await runOCR(P.canvas, run);
          impData.words = words;
        }catch(e){ if(e && e.message === 'cancelled') return; words = null; }
        if(run !== impRun) return;
      }
      const who = words ? findPerson(words, p.fio) : null;
      if(who){ finishImport({ x:who.x, y:who.y }, who.label, false); return; }
      // спрашиваем: показываем лучшие строки-кандидаты
      const na = nameArea(impData);
      imp.stage = 'pick';
      imp.cands = (dec.ranked || []).slice(0, 4).map(function(r){
        let url = null; try{ url = stripImage(P, r.band, na.xa, na.xb, 40); }catch(e){}
        return { x:r.x, y:(r.band.top(r.x) + r.band.bot(r.x))/2, url:url };
      }).filter(function(c){ return c.url; });
      imp.pickPhoto = !imp.cands.length;
      imp.pickUrl = P.canvas.toDataURL('image/jpeg', 0.8);
      imp.pickRatio = P.W / P.H;
      render();
    }catch(e){
      if(run !== impRun) return;
      let msg = (e && e.message) || '';
      if(msg === 'image') msg = 'Не удалось открыть фото. Попробуй другое.';
      else if(msg === 'no Tesseract' || msg.indexOf('xlsx') === 0 || msg === 'start' || /load|fetch|network|Failed/i.test(msg)) msg = 'Не удалось разобрать таблицу, а модуль распознавания текста не загрузился. Проверь интернет или сфотографируй таблицу ровнее и крупнее.';
      else if(!/[а-я]/i.test(msg)) msg = 'Не получилось разобрать фото. Попробуй снять таблицу ровнее и крупнее.';
      imp = { stage:'idle', msg:'', pct:0, result:null, pickUrl:null, error:null };
      impData = null;
      showAlert(msg);
    }
  }
  function finishImport(anchor, label, manual, band){
    const D = impData; if(!D) return;
    const row = readRow(D.P, D.H, D.nd, anchor, D.pitch, D.lines, D.words);
    const days = {};
    Object.keys(row.days).forEach(function(k){ if(row.days[k] !== 'text') days[+k] = row.days[k]; });
    const orig = Object.assign({}, days);
    let preview = null, nameUrl = null;
    try{ preview = rowPreview(D.P, D.H, D.nd, row, days); }catch(e){}
    try{ const na = nameArea(D); nameUrl = stripImage(D.P, row.band, na.xa, na.xb, 34); }catch(e){}
    const dbg = imp.dbg;
    imp = { stage:'review', msg:'', pct:0, pickUrl:null, error:null, dbg:dbg, result:{
      month:D.month.month, year:D.month.year, monthSure:D.month.sure, days:days, orig:orig, label:label, manual:manual, preview:preview, nameUrl:nameUrl
    } };
    // картинка больше не нужна — освобождаем память
    impData = null;
    render();
  }

  let scanStream = null, scanTorch = false, scanSeq = 0;
  function closeScanner(){

  async function openScanner(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ scanFallback(); return; }
    closeScanner();
    const seq = scanSeq;
    const root = document.createElement('div');
    root.id = 'scanner'; root.className = 'scanner';
    root.innerHTML = '<video playsinline muted autoplay></video>' +
      '<div class="scan-shade"><i></i><i></i><i></i><i></i></div>' +
      '<div class="scan-hint">Числа месяца и твоя строка — в рамке. Держи ровно, без бликов. Широкую таблицу снимай, повернув телефон.</div>' +
      '<div class="scan-bar">' +
        '<div class="scan-round" id="scanClose" aria-label="Закрыть"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>' +
        '<button class="scan-shot" id="scanShot" aria-label="Снять"></button>' +
        '<div class="scan-round" id="scanTorch" aria-label="Фонарик" style="visibility:hidden"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></div>' +
      '</div><div class="scan-flash"></div>';
    document.body.appendChild(root);
    const video = root.querySelector('video');
    root.querySelector('#scanClose').onclick = closeScanner;
    let stream = null;
    try{
      stream = await navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode:{ ideal:'environment' }, width:{ ideal:3840 }, height:{ ideal:2160 } } });
    }catch(e){
      if(seq !== scanSeq || !root.isConnected) return;
      // после отказа Safari не даст открыть камеру без нового нажатия — показываем кнопку
      const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
      root.querySelector('.scan-shade').style.display = 'none';
      root.querySelector('.scan-hint').style.display = 'none';
      root.querySelector('#scanShot').style.visibility = 'hidden';
      const box = document.createElement('div'); box.className = 'scan-err';
      box.innerHTML = (denied ? 'Нет доступа к камере. Разреши камеру для этого сайта в настройках Safari (значок «аА» → «Настройки веб-сайта») или сними фото системной камерой.'
                              : 'Не получилось открыть камеру. Можно снять фото системной камерой.') +
        '<div class="choice active" id="scanSys" style="color:#39FF14;background:#39FF1422;box-shadow:0 0 12px #39FF14;">Открыть системную камеру</div>';
      root.appendChild(box);
      box.querySelector('#scanSys').onclick = function(){ closeScanner(); scanFallback(); };
      return;
    }
    if(seq !== scanSeq || !root.isConnected){ try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} return; }
    scanStream = stream;
    video.srcObject = stream;
    try{ await video.play(); }catch(e){}
    if(seq !== scanSeq || !root.isConnected) return;
    const track = stream.getVideoTracks()[0];
    try{
      const caps = track.getCapabilities ? track.getCapabilities() : null;
      if(caps && caps.torch){
        const tb = root.querySelector('#scanTorch'); tb.style.visibility = 'visible';
        tb.onclick = function(){ scanTorch = !scanTorch; tb.classList.toggle('on', scanTorch); track.applyConstraints({ advanced:[{ torch:scanTorch }] }).catch(function(){}); };
      }
    }catch(e){}
    let taken = false;
    root.querySelector('#scanShot').onclick = function(){
      const vw = video.videoWidth, vh = video.videoHeight;
      if(!vw || !vh || taken) return;
      taken = true;
      const c = document.createElement('canvas'); c.width = vw; c.height = vh;
      c.getContext('2d').drawImage(video, 0, 0, vw, vh);
      const fl = root.querySelector('.scan-flash'); fl.style.opacity = '0.8'; setTimeout(function(){ fl.style.opacity = '0'; }, 120);
      c.toBlob(function(blob){
        closeScanner();
        if(blob) processImport(blob);
      }, 'image/jpeg', 0.95);
    };
  }

          if(migrated.workplaces) state.workplaces = migrated.workplaces;
          if(migrated.shifts) state.shifts = migrated.shifts;
          state.payments = Array.isArray(migrated.payments) ? migrated.payments : [];
          if(migrated.profile && typeof migrated.profile === 'object') state.profile = migrated.profile;
          state.version = migrated.version;
          normalizeState();
          saveState(); render();
        });
      };
      reader.readAsText(file);
    },
    addWorkplace(){
      if(activeWorkplaces().length >= 10){ showAlert('Максимум 10 текущих мест работы.'); return; }
      const idx = state.workplaces.length;
      state.workplaces.push({
        id: 'w'+Date.now(),
        name: 'Работа '+(idx+1),
        color: SWATCH_COLORS[idx % SWATCH_COLORS.length],
        payType: 'hourly',
        rate: 0,
        currency: '₽',
        shiftHours: 8
      });
      saveState(); render();
    },
    removeWorkplace(idx){
      if(activeWorkplaces().length <= 1){ showAlert('Должно остаться хотя бы одно текущее место работы.'); return; }
      const w = state.workplaces[idx];
      if(!w) return;
      askConfirm('Убрать «'+w.name+'» из текущих мест работы? Все отработанные смены и заработок останутся в календаре и отчётах — работа переедет в «Бывшие места работы», откуда её можно вернуть.', function(){
        w.archived = true;
        if(patternForm.workplaceId === w.id){ const a = activeWorkplaces()[0]; if(a) patternForm.workplaceId = a.id; }
        saveState(); render();
      }, 'Убрать');
    },
    restoreWorkplace(id){
      const w = getWorkplace(id);
      if(!w) return;
      if(activeWorkplaces().length >= 10){ showAlert('Уже 10 текущих мест работы — сначала убери одно из них.'); return; }
      w.archived = false;
      saveState(); render();
    }
  };

  Object.assign(window.WC, importActions);

  // Safari присылает отдельные события для щипка — отменяем их, чтобы экран не масштабировался
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, { passive:false });
  });

  // Свайп влево/вправо — следующий/предыдущий месяц (в календаре, отчётах и во всплывающем выборе даты).
  // Этот же обработчик touchstart нужен iOS, чтобы показывать :active-состояние кнопок.
  let sw = null;
  document.addEventListener('touchstart', function(e){
    sw = null;
    if(e.touches.length !== 1) return;
    const t = e.target;
    if(t.closest('input, textarea, .tab-bar-wrap, .update-toast, .color-swatches')) return;
    let ctx = null;
    if(t.closest('.confirm-overlay')){ if(datePickerState) ctx = 'picker'; }
    else if(!confirmState && !paymentFormState && (currentTab==='calendar' || currentTab==='reports')) ctx = 'page';
    if(!ctx) return;
    sw = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now(), ctx: ctx };
  }, { passive:true });
  document.addEventListener('touchend', function(e){
    if(!sw) return;
    const s = sw; sw = null;
    const tt = e.changedTouches && e.changedTouches[0]; if(!tt) return;
    const dx = tt.clientX - s.x, dy = tt.clientY - s.y;
    if(Date.now() - s.t > 700 || Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)*1.6) return;
    const dir = dx < 0 ? 1 : -1;
    if(s.ctx === 'picker') WC.datePickerNav(dir);
    else WC.shiftMonth(dir);
  }, { passive:true });
  document.addEventListener('touchcancel', function(){ sw = null; }, { passive:true });

  loadState();

  // После обновления: убираем служебную метку из адреса и коротко показываем результат
  if(canUpdate()){
    try{ if(/[?&]v=\d+/.test(location.search)) history.replaceState(null, '', siteBase()); }catch(e){}
    let from = null;
    try{ from = sessionStorage.getItem('wc-updated-from'); sessionStorage.removeItem('wc-updated-from'); }catch(e){}
    if(from){
      updateInfo.status = (from === APP_BUILD) ? 'same' : 'done';
      updateInfo.lastCheck = Date.now();
      render();
      setTimeout(function(){ if(updateInfo.status==='done' || updateInfo.status==='same'){ updateInfo.status='uptodate'; softRender(); } }, 4000);
    }
  }

  // Тихая проверка обновлений: через пару секунд после запуска и при возвращении в приложение
  // (не чаще раза в минуту). Ничего не блокирует — просто покажет плашку, если есть новая версия.
  if(canUpdate()){
    setTimeout(function(){ if(updateInfo.status==='idle') checkForUpdates(false); }, 2500);
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState==='visible' && Date.now()-updateInfo.lastCheck > 60000) checkForUpdates(false);
    });
  }
})();
</script>
</body>
</html>
